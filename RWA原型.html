        + (state.expTypeModal && state.typeGenPhase !== "loading" ? renderTypeCreateModal() : "")
        + "<div class=\"exp-shell\">"
        + "<div class=\"exp-toolbar\">"
        + expTabs
        + "<button type=\"button\" class=\"btn\" data-exp-zoom=\"-\">−</button>"
        + "<button type=\"button\" class=\"btn\" data-exp-zoom=\"+\">+</button>"
        + "<button type=\"button\" class=\"btn\" data-exp-zoom=\"1\">重置视图</button>"
        + "<span class=\"exp-legend\">"
        + ("<span><i style=\"background:#e8f3ef\"></i>表内线</span>"
            + "<span><i style=\"background:#e0f2fe\"></i>表外线</span>"
            + "<span><i style=\"background:#f8fafc\"></i>已否决</span>"
            + "<span><i style=\"background:#e8f3ef\"></i>本层命中</span>"
            + "<span><i style=\"background:#fff\"></i>右列细分</span>"
            + "<span><i style=\"background:#d9f7e7\"></i>风险权重</span>"
            + "<span><i style=\"background:#ede9fe\"></i>缓释拆分</span>"
            + "<span><i style=\"background:#fff1d6\"></i>RWA</span>"
            + "<span><i style=\"background:#f0fdf6\"></i>结果依据</span>")
        + "</span>"
        + (isBase ? "<button type=\"button\" class=\"btn\" data-exp-flow-modal=\"base\" data-exp-flow-mode=\"view\">查看 JSON</button>"
          + "<button type=\"button\" class=\"btn btn-primary\" data-exp-flow-modal=\"base\" data-exp-flow-mode=\"edit\">编辑 JSON</button>" : "")
        + "<span class=\"hint\">" + esc(scopeLabel)
        + " · 按宽度铺开，往下拖可看后面的分支</span>"
        + "<span class=\"tag muted\" id=\"expZoomLabel\">" + Math.round(state.expZoom * 100) + "%</span>"
        + "</div>"
        + "<nav class=\"exp-nav\" aria-label=\"线路导航\"><h3>线路</h3>"
        + "<p style=\"padding:0 12px 8px;margin:0;font-size:11px;color:var(--muted)\">"
        + (isBase ? "这是各产品的底稿，分支都在。产品只去掉不适用的" : "每个产品都基于这套模板，只去掉它不适用的分支") + "</p>"
        + nav + "</nav>"
        + "<div class=\"exp-stage\" id=\"expStage\">"
        + renderExpTypeGenBanner()
        + "<div class=\"exp-world\" id=\"expWorld\" style=\"transform:translate(" + state.expPan.x + "px," + state.expPan.y + "px) scale(" + state.expZoom + ")\">"
        + "<svg id=\"expSvg\"></svg>"
        + "<div id=\"expNodes\"></div></div></div>"
        + renderExpNodePopover(sel)
        + "</div>";
    }

    function applyExpTransform() {
      const world = document.getElementById("expWorld");
      const label = document.getElementById("expZoomLabel");
      if (world) {
        world.style.transform = "translate(" + state.expPan.x + "px," + state.expPan.y + "px) scale(" + state.expZoom + ")";
      }
      if (label) label.textContent = Math.round(state.expZoom * 100) + "%";
    }

    /** 只在打开总览或刚展开一条产品时居中；点单个节点不再把整图拽过来 */
    function centerExpOnFocus(model, byId) {
      const stage = document.getElementById("expStage");
      if (!stage || !model || !byId) return;
      if (model.global) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        (model.nodes || []).forEach(function (n) {
          minX = Math.min(minX, n.x);
          minY = Math.min(minY, n.y);
          maxX = Math.max(maxX, n.x + (n.w || 220));
          maxY = Math.max(maxY, n.y + (n.h || 56));
        });
        if (!isFinite(minX)) return;
        const viewW = Math.max(240, stage.clientWidth);
        const treeW = Math.max(1, maxX - minX);
        const fitW = (viewW - 28) / treeW;
        // 按高度适配会缩成左边一条。铺满宽度，从顶部看起，往下拖看其余分支。
        state.expZoom = Math.max(0.42, Math.min(1.05, fitW));
        state.expPan = {
          x: Math.round(12 - minX * state.expZoom),
          y: Math.round(12 - minY * state.expZoom)
        };
        applyExpTransform();
        return;
      }
      const selected = state.selectedExposure;
      const focusIds = {};
      const activeKey = model.activeProduct || overviewActiveProductKey();

      if (model.overview && !activeKey) {
        (model.nodes || []).forEach((n) => {
          if (n.kind === "process" || n.kind === "route") focusIds[n.id] = true;
        });
      } else if (selected && byId[selected]) {
        focusIds[selected] = true;
        const picked = byId[selected];
        if (picked.parent && byId[picked.parent]) focusIds[picked.parent] = true;
        if (activeKey && byId["route:" + activeKey]) focusIds["route:" + activeKey] = true;
      } else {
        const hit = (model.nodes || []).filter((n) => n.gateStatus === "gate-hit")[0];
        if (hit) focusIds[hit.id] = true;
        else if (model.nodes && model.nodes[0]) focusIds[model.nodes[0].id] = true;
      }

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      let count = 0;
      Object.keys(focusIds).forEach((id) => {
        const n = byId[id];
        if (!n) return;
        const h = n.h || 72;
        const w = n.w || 200;
        minX = Math.min(minX, n.x);
        minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + w);
        maxY = Math.max(maxY, n.y + h);
        count += 1;
      });
      if (!count || !isFinite(minX)) {
        const n = byId[selected] || (model.nodes && model.nodes[0]);
        if (!n) return;
        minX = n.x; minY = n.y;
        maxX = n.x + (n.w || 200); maxY = n.y + (n.h || 72);
      }
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const viewW = Math.max(240, stage.clientWidth);
      const viewH = Math.max(200, stage.clientHeight);
      const z = state.expZoom || 1;
      state.expPan = {
        x: Math.round(viewW / 2 - cx * z),
        y: Math.round(viewH / 2 - cy * z)
      };
      applyExpTransform();
    }

    /** 节点已在视口里就不动；只有被挡住时才平移刚好露出它 */
    function nudgeExpNodeIntoView(id, byId) {
      const stage = document.getElementById("expStage");
      const n = id && byId ? byId[id] : null;
      if (!stage || !n) {
        applyExpTransform();
        return;
      }
      const z = state.expZoom || 1;
      const pad = 28;
      const viewL = pad;
      const viewT = pad;
      const viewR = Math.max(viewL + 80, stage.clientWidth - pad);
      const viewB = Math.max(viewT + 80, stage.clientHeight - pad);
      const left = state.expPan.x + n.x * z;
      const top = state.expPan.y + n.y * z;
      const right = state.expPan.x + (n.x + (n.w || 200)) * z;
      const bottom = state.expPan.y + (n.y + (n.h || 72)) * z;
      let dx = 0;
      let dy = 0;
      if (left < viewL) dx = viewL - left;
      else if (right > viewR) dx = viewR - right;
      if (top < viewT) dy = viewT - top;
      else if (bottom > viewB) dy = viewB - bottom;
      if (dx || dy) {
        state.expPan = {
          x: Math.round(state.expPan.x + dx),
          y: Math.round(state.expPan.y + dy)
        };
      }
      applyExpTransform();
    }

    function paintExpGraph() {
      const stage = document.getElementById("expStage");
      const world = document.getElementById("expWorld");
      const nodesEl = document.getElementById("expNodes");
      const svg = document.getElementById("expSvg");
      if (!stage || !world || !nodesEl || !svg) return;
      const parkedTip = document.getElementById("expRouteTip");
      if (parkedTip) parkedTip.style.display = "none";

      const model = buildGlobalGraph();
      const byId = {};
      model.nodes.forEach((n) => { byId[n.id] = n; });

      const selected = state.selectedExposure;
      const related = {};
      if (model.global) {
        model.nodes.forEach(function (n) { related[n.id] = true; });
      } else if (model.overview) {
        related["proc:start"] = true;
        related["proc:product"] = true;
        const activeKey = model.activeProduct || overviewActiveProductKey();
        const selRoute = activeKey ? ("route:" + activeKey) : null;
        if (selRoute) {
          related[selRoute] = true;
          model.nodes.forEach((n) => {
            if (!n.overviewBranch) return;
            if (n.kind === "category" && n.gateStatus === "gate-pending") return;
            related[n.id] = true;
          });
        } else {
          model.nodes.forEach((n) => {
            if (n.kind === "process" || n.kind === "route") related[n.id] = true;
          });
        }
      } else {
        expHead().forEach((p) => { related[p.id] = true; });
        model.nodes.forEach((n) => {
          if (n.kind === "category" && n.gateStatus !== "gate-pending") related[n.id] = true;
          if (n.kind === "subclass" || n.kind === "rule" || n.kind === "result"
            || n.kind === "onbook" || n.kind === "ccf" || n.kind === "crm") related[n.id] = true;
        });
      }
      related[selected] = true;

      nodesEl.innerHTML = model.nodes.map((n) => {
        const dim = n.gateStatus === "gate-pending" ? " dim" : (!related[n.id] ? " dim" : "");
        const sel = n.id === selected ? " selected" : "";
        const gateCls = n.gateStatus ? " " + n.gateStatus : "";
        const gapKey = n.productKey || (model.overview ? model.activeProduct : state.product);
        let missing = [];
        if ((n.kind === "category" || n.kind === "subclass") && !model.global && !n.globalNode) {
          missing = missingFieldsForExpNode(n.id, gapKey);
        } else if (n.kind === "route" && n.productKey) {
          const flow = flowForProductKey(n.productKey);
          const listed = (flow && flow.field_gaps) || [];
          if (listed.length) {
            missing = listed.reduce((acc, g) => acc.concat(g.missing_fields || []), []);
          } else {
            // 尚未生成标注时，现场对照通用模板与产品字段
            const classAllow = {};
            (productClassIds(n.productKey) || []).forEach(function (id) { classAllow[id] = true; });
            const scoped = productClassIds(n.productKey);
            (flow.categories || BASE_EXP_TEMPLATE.categories || []).forEach((cat) => {
              if (scoped && !classAllow[cat.id]) return;
              missing = missing.concat(missingFieldsForExpNode(cat.id, n.productKey));
              (cat.children || []).forEach((ch) => {
                missing = missing.concat(missingFieldsForExpNode(ch.id, n.productKey));
              });
            });
          }
          missing = Array.from(new Set(missing));
        }
        const hasGap = missing.length > 0;
        const kindLabel = n.badge || {
          process: "起点",
          category: n.gateStatus === "gate-hit" ? "本层命中" : n.gateStatus === "gate-pass" ? "已否决" : "待判定",
          subclass: "细分",
          rule: n.id === "step:route" ? "路由" : (n.id === "step:rwa" ? "RWA" : "计算"),
          result: n.id === "step:out" ? "结果" : "权重",
          route: "产品线路",
          onbook: "表内",
          ccf: "表外",
          crm: "缓释"
        }[n.kind] || n.kind;
        const rwMatch = n.kind === "subclass" && n.note ? String(n.note).match(/RW\s*([^·]+)/) : null;
        const noteText = rwMatch ? String(n.note).replace(/^RW\s*[^·]+·\s*/, "") : n.note;
        const classNames = n.classes || [];
        const isRouteCard = n.kind === "route" && classNames.length > 0;
        const gapShown = missing.slice(0, 6).join("、") + (missing.length > 6 ? (" 等 " + missing.length + " 个") : "");
        const gapTip = hasGap ? ("字段未对齐：" + gapShown) : "";
        const classHtml = classNames.map(function (name) {
          return "<span class=\"exp-class\">" + esc(name) + "</span>";
        }).join("");
        const routeTip = isRouteCard
          ? ("<div class=\"exp-tip\">"
            + "<div class=\"exp-tip-k\">大类 · " + classNames.length + "</div>"
            + "<span class=\"exp-classes\">" + classHtml + "</span>"
            + (noteText ? "<div class=\"exp-tip-meta\">" + esc(noteText) + "</div>" : "")
            + (hasGap ? "<div class=\"exp-tip-gap\">缺字段 " + esc(gapShown) + "</div>" : "")
            + "</div>")
          : "";
        return "<div class=\"exp-node " + esc(n.kind) + (n.compact ? " compact" : "") + gateCls + sel + dim + (hasGap ? " has-gap" : "")
          + "\" data-exp-sel=\"" + esc(n.id) + "\" data-id=\"" + esc(n.id) + "\" style=\"left:"
          + n.x + "px;top:" + n.y + "px;width:" + (n.w || 210) + "px\">"
          + (hasGap
            ? ("<span class=\"exp-warn-icon\" title=\"" + esc(gapTip) + "\" aria-label=\"" + esc(gapTip) + "\">!</span>")
            : "")
          + "<span class=\"exp-badge\">" + esc(kindLabel) + "</span>"
          + "<span class=\"exp-label\">" + esc(n.label) + "</span>"
          + (isRouteCard
            ? "<span class=\"exp-note\">" + classNames.length + " 个大类</span>"
            : (classHtml ? "<span class=\"exp-classes\">" + classHtml + "</span>" : ""))
          + (isRouteCard ? "" : (noteText ? "<span class=\"exp-note\">" + esc(noteText) + "</span>" : ""))
          + (rwMatch ? "<span class=\"exp-rw\">RW " + esc(rwMatch[1].trim()) + "</span>" : "")
          + routeTip
          + "</div>";
      }).join("");

      // 用真实渲染高度校正连线锚点，避免卡片内容撑高后仍按估算高度重叠
      Array.prototype.forEach.call(nodesEl.querySelectorAll(".exp-node"), (el) => {
        const id = el.getAttribute("data-id");
        const n = byId[id];
        if (!n) return;
        n.h = Math.max(n.h || 0, Math.ceil(el.offsetHeight));
        n.w = Math.max(n.w || 0, Math.ceil(el.offsetWidth));
      });

      let maxX = 1100, maxY = 700;
      model.nodes.forEach((n) => {
        maxX = Math.max(maxX, n.x + n.w + 120);
        maxY = Math.max(maxY, n.y + (n.h || 64) + 120);
      });
      svg.setAttribute("width", maxX);
      svg.setAttribute("height", maxY);
      svg.style.width = maxX + "px";
      svg.style.height = maxY + "px";

      const anchor = (n, toward) => {
        const nh = n.h || 64;
        const cx = n.x + n.w / 2;
        const cy = n.y + nh / 2;
        const dx = toward.x + toward.w / 2 - cx;
        const dy = toward.y + (toward.h || 64) / 2 - cy;
        if (Math.abs(dx) > Math.abs(dy)) {
          return dx > 0
            ? { x: n.x + n.w, y: cy }
            : { x: n.x, y: cy };
        }
        return dy > 0
          ? { x: cx, y: n.y + nh }
          : { x: cx, y: n.y };
      };

      // 总览产品分线：主轴向右，竖总线后水平接入各产品（避免多条折线重叠）
      let routeFanHtml = "";
      if (model.overview) {
        const routeEdges = model.edges.filter((e) => e.routeEdge);
        const parent = byId["proc:product"];
        const children = routeEdges.map((e) => byId[e.to]).filter(Boolean);
        if (parent && children.length) {
          const activeKey = model.activeProduct || overviewActiveProductKey();
          const selRoute = activeKey ? ("route:" + activeKey) : null;
          const pRight = parent.x + parent.w;
          const pCy = parent.y + (parent.h || 64) / 2;
          const busX = pRight + Math.max(28, Math.round((children[0].x - pRight) * 0.45));
          const ys = children.map((c) => c.y + (c.h || 64) / 2).sort((a, b) => a - b);
          const busTop = ys[0];
          const busBottom = ys[ys.length - 1];
          const trunkCls = "route-trunk flow";
          const busCls = "route-bus flow";
          routeFanHtml += "<path class=\"" + trunkCls + "\" d=\"M" + pRight + "," + pCy + " L" + busX + "," + pCy + "\" style=\"marker-end:none\"></path>";
          if (busBottom > busTop) {
            routeFanHtml += "<path class=\"" + busCls + "\" d=\"M" + busX + "," + busTop + " L" + busX + "," + busBottom + "\" style=\"marker-end:none\"></path>";
          }
          routeFanHtml += "<text x=\"" + busX + "\" y=\"" + (busTop - 12) + "\" text-anchor=\"middle\">分线</text>";
          children.forEach((c) => {
            const cy = c.y + (c.h || 64) / 2;
            const left = c.x;
            const on = !selRoute || c.id === selRoute;
            const cls = "route-drop" + (on ? " flow" : " dim");
            const marker = on ? "url(#expArrowFlow)" : "url(#expArrow)";
            routeFanHtml += "<path class=\"" + cls + "\" d=\"M" + busX + "," + cy + " L" + left + "," + cy + "\" style=\"marker-end:" + marker + "\"></path>";
          });
        }
      }

      const paths = model.edges.map((e) => {
        if (model.overview && e.routeEdge) return ""; // 已由 routeFanHtml 统一绘制
        const a = byId[e.from], b = byId[e.to];
        if (!a || !b) return "";
        const p1 = anchor(a, b);
        const p2 = anchor(b, a);
        let mx = (p1.x + p2.x) / 2;
        let my = (p1.y + p2.y) / 2;
        let d;
        if (e.fanOut) {
          const outX = a.x + a.w;
          const outY = a.y + (a.h || 64) / 2;
          const inX = b.x;
          const inY = b.y + (b.h || 64) / 2;
          const stubX = outX + 40;
          mx = stubX + 10;
          my = inY - 10;
          d = "M" + outX + "," + outY + " L" + stubX + "," + outY + " L" + stubX + "," + inY + " L" + inX + "," + inY;
        } else if (Math.abs(p1.y - p2.y) < 8) {
          d = "M" + p1.x + "," + p1.y + " L" + p2.x + "," + p2.y;
        } else if (Math.abs(p1.x - p2.x) < 8) {
          d = "M" + p1.x + "," + p1.y + " L" + p2.x + "," + p2.y;
        } else {
          d = "M" + p1.x + "," + p1.y + " L" + mx + "," + p1.y + " L" + mx + "," + p2.y + " L" + p2.x + "," + p2.y;
        }
        const fromOk = related[e.from] || (byId[e.from] && byId[e.from].gateStatus !== "gate-pending");
        const toOk = related[e.to] || (byId[e.to] && byId[e.to].gateStatus !== "gate-pending");
        let onPath = !!(fromOk && toOk);
        if (model.overview && e.overviewBranch) {
          onPath = !!(related[e.from] && related[e.to]);
        }
        const dim = onPath ? "" : " dim";
        const flow = (e.flow || e.yesPath) && onPath ? " flow" : "";
        const noPath = e.noPath ? " no-path" : "";
        const yesPath = e.yesPath ? " yes-path" : "";
        const marker = (e.flow || e.yesPath) && onPath ? "url(#expArrowFlow)" : "url(#expArrow)";
        const label = (e.label && onPath)
          ? "<text x=\"" + mx + "\" y=\"" + (e.fanOut ? (my - 4) : (my - 8)) + "\" text-anchor=\"" + (e.fanOut ? "start" : "middle") + "\">" + esc(e.label) + "</text>"
          : "";
        return "<path class=\"" + flow + noPath + yesPath + dim + "\" d=\"" + d + "\" style=\"marker-end:" + marker + "\"></path>" + label;
      }).join("");
      svg.innerHTML = "<defs><marker id=\"expArrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">"
        + "<path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#94a3b8\"></path></marker>"
        + "<marker id=\"expArrowFlow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">"
        + "<path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#1a5f4a\"></path></marker></defs>"
        + routeFanHtml + paths;

      if (state.expCenterPending) {
        state.expCenterPending = false;
        state.expEnsureVisible = "";
        centerExpOnFocus(model, byId);
      } else if (state.expEnsureVisible) {
        const visibleId = state.expEnsureVisible;
        state.expEnsureVisible = "";
        nudgeExpNodeIntoView(visibleId, byId);
      } else {
        applyExpTransform();
      }
      bindExpCanvas();
    }

    function bindExpCanvas() {
      const stage = document.getElementById("expStage");
      const world = document.getElementById("expWorld");
      if (!stage || !world || stage._expBound) return;
      stage._expBound = true;
      let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
      stage.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".exp-node") || e.target.closest("button")) return;
        dragging = true;
        world.classList.add("dragging");
        sx = e.clientX; sy = e.clientY;
        ox = state.expPan.x; oy = state.expPan.y;
        stage.setPointerCapture(e.pointerId);
      });
      stage.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        state.expPan = { x: ox + (e.clientX - sx), y: oy + (e.clientY - sy) };
        applyExpTransform();
      });
      stage.addEventListener("pointerup", () => {
        dragging = false;
        world.classList.remove("dragging");
      });
      stage.addEventListener("wheel", (e) => {
        e.preventDefault();
        const rect = stage.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const prev = state.expZoom;
        const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;
        const next = Math.max(0.08, Math.min(2.2, prev * factor));
        // 以鼠标位置为中心缩放
        state.expPan = {
          x: mx - (mx - state.expPan.x) * (next / prev),
          y: my - (my - state.expPan.y) * (next / prev)
        };
        state.expZoom = next;
        applyExpTransform();
      }, { passive: false });
    }

    function weightResultEditor(sel) {
      const type = (sel.result && sel.result.type) || "const";
      const shown = type === "const" || type === "max" ? ((sel.result && sel.result.display) || sel.rw || "") : resultText(sel.result);
      const typeOpts = WEIGHT_RESULT_TYPES.map(function (pair) {
        return "<option value=\"" + pair[0] + "\"" + (type === pair[0] ? " selected" : "") + ">" + pair[1] + "</option>";
      }).join("");
      let valueBox = "";
      if (type === "const") {
        valueBox = "<div class=\"field\"><label>百分比</label><input id=\"rwEditRw\" value=\"" + esc(shown) + "\" /></div>";
      } else if (type === "max") {
        valueBox = "<div class=\"field\"><label>固定值</label><input id=\"rwEditRw\" value=\"" + esc((sel.result && sel.result.display) || "90%") + "\" />"
          + "<div style=\"font-size:11px;color:var(--muted);margin-top:4px\">与交易对手的普通债权权重取较大值。</div></div>";
      } else if (type === "counterparty") {

          + "<div class=\"field\"><label>比较</label><div style=\"display:flex;gap:8px\"><select id=\"ccfCondOp" + i + "\" style=\"width:72px\">" + opOpts + "</select><div style=\"flex:1\">" + valueBox + "</div></div></div>"
          + "<button type=\"button\" class=\"btn\" data-ccf-del-cond=\"" + i + "\">去掉这条判定</button></div>";

    function readCcfCondEditor() {
      const out = [];
      for (let i = 0; ; i++) {
        const fieldEl = document.getElementById("ccfCondField" + i);
        if (!fieldEl) break;
        const field = fieldEl.value;
        const opEl = document.getElementById("ccfCondOp" + i);
        const op = opEl ? opEl.value : "=";
        const item = { field: field, operator: op };
        const boolEl = document.getElementById("ccfCondBool" + i);
        const paramEl = document.getElementById("ccfCondParam" + i);
        const valueEl = document.getElementById("ccfCondValue" + i);
        if (boolEl) item.value = boolEl.value === "true";
        else if (paramEl && paramEl.value) {
          item.param = paramEl.value;
          item.value = { param: paramEl.value };
        } else if (valueEl) {
          const value = String(valueEl.value || "").trim();
          item.value = op === "in" ? value.split("|").map(function (s) { return s.trim(); }).filter(Boolean) : value;
        }
        if (field) out.push(item);
      }
      return out;
    }

            + "<td><input type=\"checkbox\" data-cls-field=\"" + esc(f.key) + "\"" + (picked ? " checked" : "") + " /></td>"
            + "<td><strong>" + esc(f.field) + "</strong>"
            + "<div class=\"mono\" style=\"color:var(--muted);font-size:11px\">" + esc(f.key) + "</div>"
            + (reason ? "<div style=\"font-size:11px;color:var(--muted);margin-top:4px\">" + esc(reason) + "</div>" : "")
            + "</td>"
            + "<td>" + valueCell + "</td>"
            + "<td><select data-cls-src=\"" + esc(f.id) + "\" style=\"min-width:160px;font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:#fff\">"
            + excelSourceOptions(f.id, f.assign) + "</select></td>"
            + "<td style=\"font-size:12px;color:var(--muted)\">" + esc(f.role) + "</td>"
            + "</tr>";
        }).join("");
        return (missing.length
            ? "<div class=\"banner warn\">还有 " + missing.length + " 个选用字段没有来源。点「发给模型映射」，每一项都会对上列，对不上的填成常量。</div>"
            : "<div class=\"banner ok\">判定字段都已有来源。列来自「" + esc(currentUpload().file)
              + "」。确认后开始计算，风险暴露类型和 RWA 会写在每一行上。</div>")
          + (state.mapError ? "<div class=\"banner warn\">" + esc(state.mapError) + "</div>" : "")
          + (state.mapExtract ? "<div class=\"banner\">" + esc(state.mapExtract) + "</div>" : "")
          + "<div class=\"panel\"><div class=\"panel-head\"><h2>判定字段</h2>"
          + "<span>已选 " + pickedFields.length + " / " + judgeFields.length
          + " · 已映射 " + (pickedFields.length - missing.length) + " / " + pickedFields.length
          + " · 工作表 " + esc(currentUpload().sheet) + "</span></div>"
          + "<div class=\"table-wrap\" style=\"max-height:420px\"><table class=\"data\"><thead><tr>"
          + "<th style=\"width:44px\">选用</th><th>字段</th><th>取值示意</th><th>来源（Excel 列）</th><th>作用</th>"
          + "</tr></thead><tbody>" + fieldRows + "</tbody></table></div></div>"
          + "<div class=\"calc-nav\">"
          + "<button type=\"button\" class=\"btn\" data-cls-remap" + (state.mapPhase === "loading" ? " disabled" : "") + ">发给模型映射</button>"
          + "<button type=\"button\" class=\"btn\" data-cls-fields-all>全选字段</button>"
          + "<button type=\"button\" class=\"btn btn-primary\" data-calc-stage=\"1\""
          + (pickedFields.length === 0 || missing.length ? " disabled" : "") + ">映射完成 · 开始计算 →</button>"
          + "</div>";
      }

      const fieldChips = pickedFields.map((f) =>
        "<span class=\"tag muted\" style=\"margin:2px 4px 2px 0\">" + esc(f.field) + "</span>"
      ).join("");
      const bodyRows = detailRows.map((row) => {
        const picked = state.classifyPick[row.id] !== false;
        const tag = state.classifyTags[row.id] || suggestRowClassifyTag(row);
        return "<tr" + (picked ? "" : " style=\"opacity:.5\"") + ">"
          + "<td><input type=\"checkbox\" data-cls-pick=\"" + esc(row.id) + "\"" + (picked ? " checked" : "") + " /></td>"
          + showCols.map((c) => "<td>" + esc(row[c[0]] == null ? "—" : row[c[0]]) + "</td>").join("")
          + "<td class=\"cls-tag-cell\">" + tagSelect(row.id, tag) + "</td>"
          + "</tr>";
      }).join("");
      const summary = {};
      detailRows.filter((row) => state.classifyPick[row.id] !== false).forEach((row) => {
        const tag = state.classifyTags[row.id] || suggestRowClassifyTag(row);
        summary[tag] = (summary[tag] || 0) + 1;
      });
      const summaryChips = Object.keys(summary).map((k) =>
        "<span class=\"tag accent\" style=\"margin:3px 6px 3px 0\">" + esc(classifyTagLabel(k))
        + " · " + summary[k] + " 笔</span>"
      ).join("");
      return stepBar
        + "<div class=\"banner ok\">第二步：基于已确认的判定字段，给上传的每一行业务明细打暴露分类标签（可手动改）。</div>"
        + "<div class=\"panel\" style=\"margin-bottom:12px\"><div class=\"panel-head\"><h2>已确认判定字段</h2>"
        + "<span>" + pickedFields.length + " 个</span></div>"
        + "<div style=\"padding:12px 16px\">" + (fieldChips || "<span class=\"opt\">未选字段</span>")
        + " <button type=\"button\" class=\"btn\" style=\"margin-left:8px\" data-cls-step=\"1\">改字段</button></div></div>"
        + "<div class=\"panel\" style=\"margin-bottom:12px\"><div class=\"panel-head\"><h2>标签汇总</h2>"
        + "<span>" + esc(state.mapFile || currentUpload().file) + " · " + detailRows.length + " 行</span></div>"
        + "<div style=\"padding:12px 16px\">" + (summaryChips || "<span class=\"opt\">尚未打标</span>") + "</div></div>"
        + "<div class=\"panel\"><div class=\"panel-head\"><h2>上传明细 · 打标</h2>"
        + "<span>" + esc(currentUpload().sheet) + "</span></div>"
        + "<div class=\"table-wrap\" style=\"max-height:380px\"><table class=\"data\"><thead><tr>"
        + "<th style=\"width:44px\">选用</th>"
        + showCols.map((c) => "<th>" + esc(c[1]) + "</th>").join("")
        + "<th>分类标签（可调）</th>"
        + "</tr></thead><tbody>" + bodyRows + "</tbody></table></div></div>"
        + "<div class=\"calc-nav\">"
        + "<button type=\"button\" class=\"btn\" data-cls-step=\"1\">← 回确认字段</button>"
        + "<button type=\"button\" class=\"btn\" data-cls-autotag>按建议一键打标</button>"
        + "<button type=\"button\" class=\"btn btn-primary\" data-calc-stage=\"1\">打标完成 · 核对映射 →</button>"
        + "</div>";
    }

    function renderCalcLegCard(leg, idx, legResult) {
      const active = idx === state.selectedLeg;
      const r = legResult || calcOneLeg(leg);
      const cls = r.classify || effectiveClassify(leg);
      const crmOpts = CRM_RULES.map(function (rule) {
        return "<option value=\"" + esc(rule.id) + "\">" + esc(rule.id + " · " + rule.type) + "</option>";
      }).join("");
      const apps = (leg.crmApps || []).map(function (app, k) {
        const rule = CRM_RULES.find(function (item) { return item.id === app.ruleId; }) || CRM_RULES[0];
        const seg = (r.segs || []).find(function (s) { return s.appIndex === k; }) || {};
        return "<div style=\"border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:0 14px 8px\">"
          + "<div class=\"toolbar\" style=\"margin:0\">"
          + "<div class=\"field\"><label>缓释规则</label><select data-crm-field=\"ruleId\" data-leg=\"" + idx + "\" data-crm-i=\"" + k + "\">"
          + crmOpts.replace("value=\"" + esc(app.ruleId) + "\"", "value=\"" + esc(app.ruleId) + "\" selected")
          + "</select></div>"
          + "<div class=\"field\"><label>覆盖金额（亿）</label><input class=\"num-in\" data-crm-field=\"coverageYi\" data-leg=\"" + idx + "\" data-crm-i=\"" + k + "\" type=\"number\" step=\"1\" value=\"" + (app.coverageYi || 0) + "\" /></div>"
          + "<div class=\"field\"><label>替代权重规则</label><select data-crm-field=\"rwRuleId\" data-leg=\"" + idx + "\" data-crm-i=\"" + k + "\">" + constWeightOptions(app.rwRuleId) + "</select></div>"
          + "<div class=\"field\"><label>折扣（0–1）</label><input class=\"num-in\" data-crm-field=\"haircut\" data-leg=\"" + idx + "\" data-crm-i=\"" + k + "\" type=\"number\" step=\"0.01\" min=\"0\" max=\"1\" value=\"" + (app.haircut || 0) + "\" /></div>"
          + "<button type=\"button\" class=\"btn\" data-crm-remove=\"" + idx + "\" data-crm-i=\"" + k + "\">去掉</button>"
          + "</div>"
          + "<div style=\"display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin-top:6px\">"
          + "<label><input type=\"checkbox\" data-crm-field=\"eligible\" data-leg=\"" + idx + "\" data-crm-i=\"" + k + "\"" + (app.eligible ? " checked" : "") + " /> 合格</label>"
          + "<label><input type=\"checkbox\" data-crm-field=\"maturityMatch\" data-leg=\"" + idx + "\" data-crm-i=\"" + k + "\"" + (app.maturityMatch ? " checked" : "") + " /> 期限匹配</label>"
          + "<label><input type=\"checkbox\" data-crm-field=\"currencyMatch\" data-leg=\"" + idx + "\" data-crm-i=\"" + k + "\"" + (app.currencyMatch ? " checked" : "") + " /> 币种匹配</label>"
          + (rule.floorParam ? "<label><input type=\"checkbox\" data-crm-field=\"floorExempt\" data-leg=\"" + idx + "\" data-crm-i=\"" + k + "\"" + (app.floorExempt ? " checked" : "") + " /> 特定回购豁免底线</label>" : "")
          + (rule.constraints && rule.constraints.correlation ? "<label><input type=\"checkbox\" data-crm-field=\"correlated\" data-leg=\"" + idx + "\" data-crm-i=\"" + k + "\"" + (app.correlated ? " checked" : "") + " /> 与债务人高度正相关</label>" : "")
          + "</div>"
          + "<div style=\"font-size:12px;color:var(--muted);margin-top:6px\">" + esc(seg.note || "") + "</div>"
          + "</div>";
      }).join("");
      const pipes = (r.segs || []).filter(function (s) { return s.amount > 0; }).map(function (s) {
        return "<div style=\"font-size:12px;color:var(--muted)\">" + esc(s.name) + " " + yi(s.amount) + " × " + pct(s.rw) + " · " + esc(s.rule) + "</div>";
      }).join("");
      return "<div class=\"calc-leg" + (active ? " active" : "") + "\" data-leg-sel=\"" + idx + "\">"
        + "<div class=\"calc-leg-head\">"
        + "<span class=\"tag " + (leg.offbalance ? "warn" : "accent") + "\">" + (leg.offbalance ? "表外" : "表内") + "</span>"
        + "<span class=\"tag " + (cls.manual ? "warn" : "ok") + "\">" + esc(cls.category) + " · " + esc(cls.subclass)
        + (cls.rwHint ? (" · " + esc(cls.rwHint)) : "")
        + (cls.manual ? " · 手调" : "") + "</span>"
        + "<input style=\"min-width:168px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px\" data-leg-field=\"name\" data-leg=\"" + idx + "\" value=\"" + esc(leg.name || "") + "\" />"
        + "<span class=\"spacer\"></span>"
        + "<span style=\"font-size:12px;color:var(--muted)\">EAD <b style=\"color:var(--text)\">" + yi(r.ead) + "</b> · RWA <b style=\"color:var(--text)\">" + yi(r.rwa) + "</b></span>"
        + "<button type=\"button\" class=\"btn\" data-leg-remove=\"" + idx + "\"" + (state.calcLegs.length <= 1 ? " disabled" : "") + ">删除</button>"
        + "</div>"
        + "<div class=\"toolbar\">"
        + "<div class=\"field\"><label>表内/表外</label><select data-leg-field=\"offbalance\" data-leg=\"" + idx + "\">"
        + "<option value=\"0\"" + (!leg.offbalance ? " selected" : "") + ">表内资产</option>"
        + "<option value=\"1\"" + (leg.offbalance ? " selected" : "") + ">表外（乘 CCF 规则）</option></select></div>"
        + (leg.offbalance
          ? "<div class=\"field\"><label>名义金额（亿）</label><input class=\"num-in\" data-leg-field=\"nominalYi\" data-leg=\"" + idx + "\" type=\"number\" step=\"1\" value=\"" + leg.nominalYi + "\" /></div>"
            + "<div class=\"field\"><label>CCF 规则</label><select data-leg-field=\"ccfRuleId\" data-leg=\"" + idx + "\">"
            + CCF_RULES.map(function (rule) {
              return "<option value=\"" + esc(rule.id) + "\"" + (leg.ccfRuleId === rule.id ? " selected" : "") + ">" + esc(rule.id + " · " + rule.ccf) + "</option>";
            }).join("")
            + "</select></div>"
          : "<div class=\"field\"><label>账面余额（亿）</label><input class=\"num-in\" data-leg-field=\"balanceYi\" data-leg=\"" + idx + "\" type=\"number\" step=\"1\" value=\"" + leg.balanceYi + "\" /></div>"
            + "<div class=\"field\"><label>减值准备（亿）</label><input class=\"num-in\" data-leg-field=\"impairmentYi\" data-leg=\"" + idx + "\" type=\"number\" step=\"1\" value=\"" + leg.impairmentYi + "\" /></div>")
        + (leg.fromPaper || (cls && typeof cls.rwRate === "number") ? ""
          : "<div class=\"field\"><label>手填权重（%）</label><input class=\"num-in\" data-hand-rw=\"" + idx + "\" type=\"number\" min=\"0\" max=\"1250\" step=\"0.01\" placeholder=\"如 100\" value=\"" + (typeof leg.handRw === "number" ? weightPoints(leg.handRw) : "") + "\" /></div>")
        + "<div class=\"field\"><label>原风险暴露权重</label><select data-leg-field=\"originalRwRuleId\" data-leg=\"" + idx + "\">"
        + (weightRateById(leg.originalRwRuleId) == null
          ? "<option value=\"" + esc(leg.originalRwRuleId || "") + "\" selected>决策树 · " + esc((cls.subclass || "本笔") + (cls.rwHint ? " " + cls.rwHint : "")) + "</option>"
          : "")
        + constWeightOptions(leg.originalRwRuleId) + "</select></div>"
        + "</div>"
        + "<div style=\"font-size:12px;color:var(--muted);padding:0 14px 8px\">" + esc((cls.path || []).join(" → "))
        + "。" + esc(r.eadNote || "") + "。未覆盖部分用决策树权重，树没定死时才用上面的权重表。</div>"
        + apps
        + "<div style=\"padding:0 14px 8px\"><button type=\"button\" class=\"btn\" data-crm-add=\"" + idx + "\">＋ 加一条缓释</button></div>"
        + (r.over ? "<div class=\"banner warn\" style=\"margin:0 14px 10px\">本笔缓释超过 EAD，已截断。</div>" : "")
        + "<div class=\"calc-leg-sum\">"
        + "<span>" + esc(r.eadNote || "") + " → EAD <b>" + yi(r.ead) + "</b></span>"
        + "<span>公式 <b>" + esc(r.formula) + "</b></span>"
        + pipes
        + "</div></div>";
    }

    function renderPaperRunBody(calc) {
      return "<div class=\"banner ok\">" + esc((state.uploadBook && state.uploadBook.paperNote) || "数字来自信用风险底稿。") + "</div>"
        + "<div class=\"metric-row\">"
        + "<div class=\"metric\"><label>合计 EAD</label><strong>" + yi(calc.ead) + "</strong><small>" + (calc.legs || []).length + " 档</small></div>"
        + "<div class=\"metric\"><label>合计 RWA</label><strong>" + yi(calc.rwa) + "</strong><small>权重未定的不计入</small></div>"
        + "<div class=\"metric\"><label>资本（8%）</label><strong>" + yi(calc.rwa * 0.08) + "</strong><small>示意</small></div>"
        + "</div>"
        + paperResultTable()
        + "<div class=\"calc-nav\">"
        + "<button type=\"button\" class=\"btn\" data-calc-stage=\"0\">← 回映射</button>"
        + "<span style=\"display:flex;gap:8px\">" + paperDownloadLink()
        + "<button type=\"button\" class=\"btn btn-primary\" data-calc-stage=\"2\">查看结果追溯 →</button></span>"
        + "</div>";
    }

    function renderCalcRunBody(calc) {
      if (state.uploadBook && state.uploadBook.basis === "paper" && paperResultRows().length) {
        return renderPaperRunBody(calc);
      }
      const ead = calc.ead;
      const bar = calc.segs.map((seg, i) => {
        const colors = ["#1a5f4a", "#2f8f6e", "#0f766e", "#b45309", "#94a3b8", "#64748b"];
        const w = ead > 0 ? (seg.amount / ead * 100) : 0;
        return "<span style=\"width:" + Math.max(w, seg.amount > 0 ? 2 : 0) + "%;background:" + colors[i % colors.length] + "\">"
          + (w > 14 ? esc(seg.name) : "") + "</span>";
      }).join("");
      const segRows = calc.segs.map((seg) =>
        "<tr><td>" + esc(seg.name) + "</td>"
        + "<td class=\"num\">" + yi(seg.amount) + "</td>"
        + "<td class=\"num\">" + pct(seg.rw) + "</td>"
        + "<td class=\"num\"><strong>" + yi(seg.rwa) + "</strong></td>"
        + "<td class=\"mono\">" + esc(seg.rule) + "</td></tr>"
      ).join("");
      const mapOk = state.mapPhase === "confirmed";
      const legCards = (calc.legs || []).map((r, i) => renderCalcLegCard(r.leg, i, r)).join("");
      const catalog = state.uploadBook && state.uploadBook.basis === "catalog";
      const paper = state.uploadBook && state.uploadBook.basis === "paper";
      return (paper
          ? "<div class=\"banner ok\">" + esc(state.uploadBook.paperNote || "数字来自信用风险底稿。") + "</div>"
          : catalog
          ? "<div class=\"banner ok\">这批明细的列来自《信用风险RWA-产品字段清单》。金额是清单里的澳门元，这里折成亿元，再按权重法决策树计算 RWA。</div>"
          : mapOk
          ? "<div class=\"banner ok\">映射已确认（" + esc(PRODUCTS[state.product].label) + "）· 监管版本 "
            + esc(state.selectedVersion) + "。每笔卡片上的标签来自上一步分类判断。</div>"
          : "<div class=\"banner warn\">尚未核对映射。可先用文档示例试算，或回上一步核对该模型的字段。</div>")
        + "<div class=\"head-actions\" style=\"margin-bottom:12px\">"
        + (paper ? "<button type=\"button\" class=\"btn btn-primary\" data-calc-download>下载计算结果</button>" : "")
        + "<button type=\"button\" class=\"btn\" data-leg-add=\"on\">＋ 添加表内</button>"
        + "<button type=\"button\" class=\"btn\" data-leg-add=\"off\">＋ 添加表外</button>"
        + "<button type=\"button\" class=\"btn\" data-reset-demo>恢复文档示例</button>"
        + "</div>"
        + "<div class=\"calc-legs\">" + legCards + "</div>"
        + "<div class=\"metric-row\">"
        + "<div class=\"metric\"><label>合计 EAD</label><strong>" + yi(calc.ead) + "</strong>"
        + "<small>表内 " + calc.onCount + " 笔 · 表外 " + calc.offCount + " 笔</small></div>"
        + "<div class=\"metric\"><label>合计 RWA</label><strong>" + yi(calc.rwa) + "</strong><small>" + esc(state.selectedVersion) + "</small></div>"
        + "<div class=\"metric\"><label>资本（8%）</label><strong>" + yi(calc.rwa * 0.08) + "</strong><small>示意</small></div>"
        + "<div class=\"metric\"><label>缓释节省</label><strong>" + yi(Math.max(0, (calc.fullUncovered || 0) - calc.rwa)) + "</strong><small>相对全额未缓释</small></div>"
        + "</div>"
        + "<div class=\"panel\"><div class=\"panel-head\"><h2>合计 CRM 拆分</h2><span>多笔汇总</span></div>"
        + "<div style=\"padding:16px 18px\">"
        + "<div class=\"split-bar\">" + bar + "</div>"
        + "<div class=\"table-wrap\" style=\"max-height:none\"><table class=\"data\"><thead><tr>"
        + "<th>部分</th><th>暴露</th><th>RW</th><th>RWA</th><th>规则</th></tr></thead><tbody>"
        + segRows
        + "<tr style=\"font-weight:650\"><td>合计</td><td class=\"num\">" + yi(calc.ead) + "</td><td></td>"
        + "<td class=\"num\">" + yi(calc.rwa) + "</td><td></td></tr></tbody></table></div>"
        + "<div class=\"formula-box\">" + esc(calc.formula) + "</div></div></div>"
        + "<div class=\"calc-nav\">"
        + "<button type=\"button\" class=\"btn\" data-calc-stage=\"0\">← 回映射</button>"
        + "<span style=\"display:flex;gap:8px\">"
        + "<button type=\"button\" class=\"btn btn-primary\" data-calc-download>下载计算结果</button>"
        + "<button type=\"button\" class=\"btn\" data-calc-stage=\"2\">查看结果追溯 →</button>"
        + "</span></div>";
    }

    function renderPaperTraceBody(calc) {
      const steps = paperResultRows().map(function (row) {
        return "<div class=\"trace-item\"><strong>" + esc(row.name) + "</strong>"
          + "<span>" + esc(row.path || row.hint) + " · 敞口 " + yi(row.ead) + " · RWA " + yi(row.rwa) + "</span></div>";
      }).join("");
      return "<div class=\"metric-row\">"
        + "<div class=\"metric\"><label>敞口</label><strong>" + yi(calc.ead) + "</strong></div>"
        + "<div class=\"metric\"><label>风险加权资产</label><strong>" + yi(calc.rwa) + "</strong></div>"
        + "<div class=\"metric\"><label>监管版本</label><strong style=\"font-size:15px\">" + esc(state.selectedVersion) + "</strong></div>"
        + "</div>"
        + "<div class=\"panel\"><div class=\"panel-head\"><h2>规则链追溯</h2><span>分类 → 字段核对 → 风险加权资产</span></div>"
        + "<div style=\"padding:16px 18px\"><div class=\"trace\">" + steps + "</div>"
        + "<div class=\"formula-box\">" + esc(calc.formula) + "</div></div></div>"
        + "<div class=\"calc-nav\">"
        + "<button type=\"button\" class=\"btn\" data-calc-stage=\"1\">← 回计算</button>"
        + "<span style=\"display:flex;gap:8px\">"
        + "<button type=\"button\" class=\"btn\" data-calc-stage=\"0\">回映射</button>"
        + paperDownloadLink()
        + "</span></div>";
    }

    function renderCalcTraceBody(calc) {
      if (state.uploadBook && state.uploadBook.basis === "paper" && paperResultRows().length) {
        return renderPaperTraceBody(calc);
      }
      const firstCls = (calc.legs && calc.legs[0] && calc.legs[0].classify) || null;
      const clsSummary = (calc.legs || []).map((r) => {
        const c = r.classify || classifyLeg(r.leg);
        return (r.leg.name || "暴露") + " → " + c.category + "/" + c.subclass + "（" + c.ruleId + "）";
      }).join("；");
      const dynamicSteps = ENGINE_STEPS.map((s) => {
        if (s.title === "分类判断" && firstCls) {
          return { title: s.title, detail: clsSummary || s.detail };
        }
        return s;
      });
      const portRows = PORTFOLIO.map((t, i) =>
        "<tr class=\"clickable" + (i === state.selectedTrade ? " selected" : "") + "\" data-trade=\"" + i + "\">"
        + "<td class=\"mono\">" + esc(t.id) + "</td><td>" + esc(t.product) + "</td><td>" + esc(t.cls) + "</td>"
        + "<td class=\"num\">" + t.ead + "</td><td class=\"num\">" + esc(t.rw) + "</td>"
        + "<td class=\"num\"><strong>" + t.rwa + "</strong></td><td style=\"color:var(--muted)\">" + esc(t.note) + "</td></tr>"
      ).join("");
      const portRwa = PORTFOLIO.reduce((s, t) => s + t.rwa, 0);
      const hitRules = [];
      (calc.legs || []).forEach(function (r) {
        if (r.classify && r.classify.ruleId) hitRules.push(r.classify.ruleId);
        if (r.offbalance && r.ccfRuleId) hitRules.push(r.ccfRuleId);
        (r.segs || []).forEach(function (s) { if (s.rule) hitRules.push(s.rule); });
      });
      const uniqHits = Array.from(new Set(hitRules));

      const stages = CALC_STAGES.map((s, i) =>
        "<button type=\"button\" class=\"calc-stage" + (i === stage ? " active" : "") + (i < stage ? " done" : "") + "\" data-calc-stage=\"" + i + "\">"

      const pageId = (opts && opts.page) || state.page;

          offbalance: true, nominalYi: 50, ccfRuleId: rule.id, crmApps: []
        }));
        state.selectedLeg = state.calcLegs.length - 1;
        state.page = "engine";
        state.calcStage = 1;
        return { ok: true, text: "已在试算中新增一笔表外暴露，使用 " + rule.id + "（" + rule.ccf + "）。可与表内同时合计。" };
      }
      if (action === "crm:add-gold") {
        state.page = "crm";
        const i = CRM_RULES.findIndex((r) => r.id === "CRM_COL_CASH");
        state.selectedCrm = i >= 0 ? i : 0;
        return { ok: true, text: "黄金是合格质物。受保护部分取得质物本身的风险权重，权重表没有把黄金写成 0%。" };
      }
      if (action === "crm:pick-gov") {
        const i = CRM_RULES.findIndex((r) => /国债|政府|质物/.test(r.tool + r.type));
        state.selectedCrm = i >= 0 ? i : 0;
        return { ok: true, text: "已选中国债/政府类质押规则。" };
      }
      if (action === "crm:to-engine") {
        state.page = "engine";
        state.calcStage = 1;
        return { ok: true, text: "已打开计算 · 试算，可改质押/保证金额即时重算 CRM 拆分。" };
      }
      if (action === "eng:reset") {
        state.calcLegs = demoCalcLegs();
        state.selectedLeg = 0;
        state.calcStage = 1;
        return { ok: true, text: "已恢复文档基准例（单笔表内）：账面 100、减值 10、质押 10、保证 50 → RWA 55。可再添加表外。" };
      }
      if (action === "eng:off80") {
        state.calcLegs.push(newCalcLeg({
          name: "贷款承诺（表外）", offbalance: true,
          nominalYi: 50, ccfRuleId: "CCF_COMMIT_40", crmApps: []
        }));
        state.selectedLeg = state.calcLegs.length - 1;
        state.calcStage = 1;
        return { ok: true, text: "已追加贷款承诺：名义 50 亿 × CCF_COMMIT_40 的 40% = 等值表内 20 亿。系数来自 CCF 规则，不是另写的风险权重。" };
      }
      if (action === "eng:guar40") {
        const leg = state.calcLegs[state.selectedLeg] || state.calcLegs[0];
        if (leg) {
          if (!leg.crmApps) leg.crmApps = [];
          let app = leg.crmApps.find(function (item) { return item.ruleId === "CRM_GUAR_PSE"; });
          if (!app) {
            app = defaultCrmApp("CRM_GUAR_PSE");
            leg.crmApps.push(app);
          }
          app.coverageYi = 40;
        }
        state.calcStage = 1;
        return { ok: true, text: "当前笔保证覆盖已改为 40 亿，合计 RWA 已重算。" };
      }
      return { ok: false, text: "暂未支持该操作：" + action };
    }

    function inferAgentAction(text) {
      const t = String(text || "");
      const ag = currentAgent();
      const hit = (ag.chips || []).find((c) => t.indexOf(c.label.replace(/\s/g, "")) >= 0 || t.indexOf(c.label) >= 0);
      if (hit) return hit.action;
      if (/香港/.test(t)) return "reg:hk";
      if (/内地|大陆|2025/.test(t) && state.page === "regulation") return "reg:cn";
      if (/打开新建|新建版本/.test(t) && state.page === "regulation") return "reg:open-create";
      if (/全部检索|全局/.test(t) && state.page === "regulation") return "reg:kb-global";
      if (/本客户|沉淀到本/.test(t) && state.page === "regulation") return "reg:kb-client";
      if (/更新时点|刷新/.test(t) && state.page === "regulation") return "reg:bump-time";
      if (/新建类型|新建产品类型|产品类型/.test(t) && /新建|新增|打开/.test(t)) return "field:open-type";
      if (/同步当前|同步.*类型|同步.*字段|从知识库同步/.test(t)) return "field:sync-one";
      if (/打开新建|新建字段|自己维护|自行维护/.test(t)) return "field:open-create";
      if (/澳门/.test(t) && /新建|新增|草案/.test(t)) return "reg:new-mo";
      if (/LTV|ltv/.test(t) && /新增|添加|加/.test(t)) return "field:add-ltv";
      if (/投资级/.test(t) && /必填/.test(t)) return "field:req-ig";
      if (/核心字段|补齐/.test(t)) return "field:core";
      if (/上传|识别/.test(t) && state.page === "engine") return "map:demo";
      if (/确认映射/.test(t)) return "map:confirm";
      if (/公司/.test(t) && /演示|命中/.test(t)) return "exp:demo-corp";
      if (/总览|分线|识别产品/.test(t)) return "exp:scope-product";
      if (/基础模板|基础流程|通用模板|通用流程/.test(t)) return "exp:scope-base";
      if (/产品流程|产品线路|当前产品.*流程/.test(t)) return "exp:scope-product";
      if (/科创|高新/.test(t)) return "exp:add-kcb";
      if (/70%|投资级/.test(t) && state.page === "weights") return "rw:add-ig70";
      if (/恢复|文档示例|基准/.test(t) && state.page === "engine") return "eng:reset";
      if (/表外/.test(t) && state.page === "engine") return "eng:off80";
      if (/保证/.test(t) && /40/.test(t)) return "eng:guar40";
      if (/黄金/.test(t)) return "crm:add-gold";
      if (/信用证/.test(t)) return "ccf:add";
      if (/解释|分工|架构/.test(t)) return "explain";
      return null;
    }

    function maintField(id) {

    function saveMaint(kind, id) {
      if (kind === "param") {
        const row = PARAMS.find((p) => p.id === id);
        if (!row) return "没找到这条参数。";
        const name = maintField("paramEditName");
        const value = maintField("paramEditValue");
        if (!name || !value) return "名称和当前值都要填。";
        row.name = name;
        row.value = value;
        row.used = maintField("paramEditUsed");
        return "已写入 " + id + "。监管版本里的参数说明会跟着变。";
      }
      if (kind === "weight") {
        const live = allWeightRows().find((w) => w.id === id);
        if (!live) return "没找到这条权重。";
        const pri = parseInt(maintField("rwEditPri"), 10);
        const bank = maintField("rwEditBank");
        const basis = maintField("rwEditBasis");
        if (live.grid) {
          const rw = maintField("rwEditRw");
          if (!rw) return "百分比要填。";
          const line = BANK_GRID.rows.find((r) => r.id === live.grid.row);
          if (!line) return "没找到评级表这一行。";
          line.weights[live.grid.col] = rw;
          return "已写入评级表 " + id + "。监管摘要会按这张表重算。";
        }
        const row = WEIGHTS.find((w) => w.id === id);
        if (!row) return "没找到这条权重。";
        const type = maintField("rwEditType") || (row.result && row.result.type) || "const";
        let display = maintField("rwEditRw");
        if (type === "counterparty") display = "按交易对手";
        else if (type === "unspecified") display = "权重表未列明";
        else if (type === "max") display = display || "90%";
        else if (!display) return "固定百分比要填。";
        row.conds = readCondEditor("rwCond", row.conds);
        if (!row.conds.length && type !== "const") return "至少留一条条件。";
        row.result = { type: type, display: display };
        if (type === "const" || type === "max") row.result.risk_weight = parseWeightNumber(display);
        if (type === "max") row.result.with = "counterparty";
        if (Number.isFinite(pri)) row.pri = pri;
        if (bank) row.bank = bank;
        row.basis = basis;
        syncWeightText(row);
        return "已写入 " + id + "。监管摘要和监管版本都会按这张表重算。";
      }
      if (kind === "mo-weight") {
        document.querySelectorAll("[data-mo-id]").forEach(function (el) {
          const rec = MO_WEIGHTS.find(function (r) { return r.id === el.getAttribute("data-mo-id"); });
          const i = parseInt(el.getAttribute("data-mo-i"), 10);
          if (!rec || !Number.isFinite(i)) return;
          rec.weights[i] = String(el.value || "").trim() || rec.weights[i];
        });
        syncMoRegulation();
        return "已写入澳门标准法权重。监管版本里的标准法说明会跟着变。";
      }
      if (kind === "ccf") {
        const row = CCF_RULES.find((r) => r.id === id);
        if (!row) return "没找到这条 CCF。";
        const type = maintField("ccfEditType");
        const ccf = maintField("ccfEditCcf");
        if (!type || !ccf) return "产品和系数都要填。";
        const note = maintField("ccfEditNote");
        const pri = parseInt(maintField("ccfEditPri"), 10);
        row.type = type;
        row.note = note || "一般";
        row.conds = readCcfCondEditor();
        row.ccf = ccf;
        row.ccfRate = parseWeightNumber(ccf);
        if (Number.isFinite(pri)) row.pri = pri;
        syncCcfText(row);
        return "已写入 " + id + "。监管版本里的 CCF 说明会跟着变。";
      }
      if (kind === "crm") {
        const row = CRM_RULES.find((r) => r.id === id);
        if (!row) return "没找到这条缓释。";
        const type = maintField("crmEditType");
        const tool = maintField("crmEditTool");
        const sub = maintField("crmEditSub");
        if (!type || !tool || !sub) return "类型、工具和替代方式都要填。";
        row.type = type;
        row.tool = tool;
        row.substitute = sub;
        const floorOn = document.getElementById("crmEditFloor");
        row.floorParam = floorOn && floorOn.checked ? "RW_FLOOR" : "";
        row.constraints = {
          maturity: !!(document.getElementById("crmEditMaturity") && document.getElementById("crmEditMaturity").checked),
          currency: !!(document.getElementById("crmEditCurrency") && document.getElementById("crmEditCurrency").checked),
          correlation: !!(document.getElementById("crmEditCorr") && document.getElementById("crmEditCorr").checked)
        };
        row.effect = crmEffect(row);
        return "已写入 " + id + "。覆盖部分的替代关系会跟着这条规则走。";
      }
      if (kind === "version") {
        const ver = VERSIONS.find((v) => v.id === id);
        if (!ver) return "没找到这个版本。";
        const status = maintField("regEditStatus");
        const from = maintField("regEditFrom");
        if (!status || !from) return "状态和生效日都要填。";
        ver.status = status;
        ver.from = from;
        ver.to = maintField("regEditTo") || "—";
        ver.updatedAt = maintField("regEditAt") || ver.updatedAt;
        ver.note = maintField("regEditNote");
        return "已保存版本说明。规则正文仍以对应菜单里的表为准。";
      }
      return "没有可保存的内容。";
    }

    function hideRouteTip() {
      const host = document.getElementById("expRouteTip");

    function showRouteTip(node) {
      const src = node.querySelector(".exp-tip");
      if (!src) return;
      let host = document.getElementById("expRouteTip");
      if (!host) {
        host = document.createElement("div");
        host.id = "expRouteTip";
        host.className = "exp-tip-fixed";
        document.body.appendChild(host);
      }
      host.innerHTML = src.innerHTML;
      host.style.display = "block";
      const rect = node.getBoundingClientRect();
      const width = 248;
      const height = host.offsetHeight || 160;
      const panel = document.querySelector(".exp-float");
      const panelBox = panel ? panel.getBoundingClientRect() : null;
      const limitRight = window.innerWidth - 12;
      let left = rect.right + 10;
      let top = rect.top;
      if (panelBox && left < panelBox.right + 8) left = panelBox.right + 10;
      if (left + width > limitRight) left = rect.left - width - 10;
      if (left < 8 || (panelBox && left < panelBox.right && left + width > panelBox.left)) {
        left = Math.max(8, Math.min(rect.left, window.innerWidth - width - 12));
        top = rect.bottom + 8;
      }
      if (top + height > window.innerHeight - 12) top = Math.max(12, rect.top - height - 8);
      host.style.left = left + "px";
      host.style.top = top + "px";
    }
