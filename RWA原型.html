<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>信用风险 RWA · 规则配置原型</title>
  <style>
    :root {
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #1a5f4a;
      --accent-soft: #e8f3ef;
      --warn: #9a5b14;
      --warn-bg: #fff8eb;
      --bg: #f1f4f8;
      --panel: #ffffff;
      --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px rgba(15, 23, 42, .04);
      --radius: 14px;
      --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --mono: "SF Mono", "Menlo", "Consolas", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: var(--font); color: var(--text); line-height: 1.55;
      background:
        radial-gradient(1200px 500px at 10% -10%, #e4f0ea 0%, transparent 55%),
        radial-gradient(900px 420px at 100% 0%, #e8eef6 0%, transparent 50%),
        var(--bg);
    }
    button, select, input, textarea { font: inherit; }
    .app-top {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 12px 22px; background: rgba(255,255,255,.86); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
    }
    .app-top-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    .client-switch {
      display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px;
      border: 1px solid var(--border); border-radius: 12px; background: #fff; box-shadow: var(--shadow);
    }
    .client-switch label {
      font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap;
    }
    .client-switch select {
      border: none; background: transparent; font-size: 13px; font-weight: 650;
      color: var(--text); padding: 6px 8px; min-width: 148px; cursor: pointer;
    }
    .client-switch select:focus { outline: none; }
    .brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(145deg, #1a5f4a, #134e3a);
      color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center;
      box-shadow: 0 4px 12px rgba(26,95,74,.25);
    }
    .brand-text strong { display: block; font-size: 15px; letter-spacing: -.01em; }
    .brand-text span { display: block; font-size: 11px; color: var(--muted); }
    .top-nav { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
    .top-nav > button, .nav-group > .nav-group-btn {
      border: none; background: transparent; color: #5c6b82; font-size: 13px; font-weight: 600;
      padding: 7px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap;
    }
    .top-nav > button:hover, .nav-group > .nav-group-btn:hover { color: var(--text); background: #eef2f7; }
    .top-nav > button.active, .nav-group.open > .nav-group-btn, .nav-group.has-active > .nav-group-btn {
      color: #134e3a; background: var(--accent-soft);
    }
    .nav-group { position: relative; }
    .nav-group-btn { display: inline-flex; align-items: center; gap: 4px; }
    .nav-group-btn .caret { font-size: 10px; opacity: .7; }
    .nav-menu {
      display: none; position: absolute; right: 0; top: calc(100% + 4px); min-width: 168px;
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .1); padding: 6px; z-index: 40;
    }
    .nav-group.open .nav-menu { display: grid; gap: 2px; }
    .nav-menu button {
      display: block; width: 100%; text-align: left; border: none; background: transparent;
      color: #334155; font-size: 13px; font-weight: 500; padding: 8px 10px; border-radius: 8px; cursor: pointer;
    }
    .nav-menu button:hover { background: #f4f6f9; }
    .nav-menu button.active { background: var(--accent-soft); color: #134e3a; font-weight: 650; }
    .nav-menu .nav-sec {
      margin: 4px 8px 2px; font-size: 10px; font-weight: 700; color: #94a3b8; letter-spacing: .04em;
    }
    .main-col { padding: 22px 24px 56px; max-width: 1280px; margin: 0 auto; }
    .main-col.exp-full {
      max-width: none; margin: 0; padding: 10px 14px 12px;
      height: calc(100vh - 62px); display: flex; flex-direction: column; box-sizing: border-box;
    }
    .main-col.exp-full .page-head {
      margin-bottom: 8px; flex-shrink: 0; padding: 0;
    }
    .main-col.exp-full .page-head h1 { font-size: 18px; }
    .main-col.exp-full .page-kicker { margin-bottom: 4px; }
    .main-col.exp-full .exp-shell {
      flex: 1; min-height: 0; height: auto;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .main-col.exp-full .exp-stage { min-height: 0; }
    .page-head {
      margin-bottom: 18px; display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; padding: 4px 2px 0;
    }
    .page-kicker {
      display: inline-flex; align-items: center; gap: 6px; margin: 0 0 8px;
      font-size: 11px; font-weight: 700; color: #1a5f4a; letter-spacing: .04em;
    }
    .page-kicker::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    }
    .page-kicker.calc { color: #1e4a7a; }
    .page-kicker.calc::before { background: #2f5fbf; }
    .page-head h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
    .page-head p { margin: 6px 0 0; font-size: 13px; color: var(--muted); max-width: 640px; line-height: 1.55; }
    .head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; border-radius: 10px; padding: 8px 14px;
      font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border);
      background: #fff; color: var(--text); transition: border-color .12s, color .12s, background .12s, box-shadow .12s;
    }
    .btn:hover { border-color: #9dc4b5; color: var(--accent); box-shadow: var(--shadow); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: #134e3a; color: #fff; border-color: #134e3a; }
    .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .banner {
      margin: 0 0 16px; padding: 11px 14px; border-radius: 12px; font-size: 13px;
      background: #fff; color: var(--muted); border: 1px solid var(--border);
    }
    .banner.ok { color: #147a4a; background: #ecfdf5; border-color: #b7ebd0; }
    .banner.warn { color: var(--warn); background: var(--warn-bg); border-color: #ead7b0; border-left: 3px solid #c47b14; white-space: pre-wrap; }

    .arch-hero {
      margin-bottom: 16px; padding: 18px 20px; border-radius: var(--radius);
      border: 1px solid #cfe3da; background: linear-gradient(135deg, #eef7f3 0%, #fff 65%);
      box-shadow: var(--shadow);
    }
    .arch-hero p { margin: 0; font-size: 14px; color: #334155; line-height: 1.55; max-width: 720px; }
    .arch-hero em { font-style: normal; color: var(--accent); font-weight: 700; }
    .arch-lanes {
      display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 14px; margin-bottom: 14px;
    }
    .arch-lane {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
    }
    .arch-lane-head {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    }
    .arch-lane-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
    .arch-lane-head p { margin: 4px 0 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
    .arch-lane.config .arch-lane-head { background: #f8fafc; }
    .arch-lane.calc .arch-lane-head { background: linear-gradient(135deg, #eef7f3, #f8fafc 80%); }
    .arch-lane-body { padding: 12px; display: grid; gap: 8px; flex: 1; }
    .arch-item {
      display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center;
      width: 100%; text-align: left; border: 1px solid var(--border); border-radius: 12px;
      background: #fff; padding: 11px 12px; cursor: pointer; color: inherit;
      transition: border-color .12s, background .12s, box-shadow .12s;
    }
    .arch-item:hover { border-color: #9dc4b5; background: #f7faf9; box-shadow: var(--shadow); }
    .arch-item .idx {
      width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
      font-size: 12px; font-weight: 700; background: #f1f5f9; color: #64748b;
    }
    .arch-lane.calc .arch-item .idx { background: var(--accent-soft); color: #134e3a; }
    .arch-item strong { display: block; font-size: 13px; }
    .arch-item span { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); line-height: 1.4; }
    .arch-item .go { font-size: 12px; color: #94a3b8; font-weight: 600; }
    .arch-item:hover .go { color: var(--accent); }
    .arch-flow {
      display: flex; flex-direction: column; gap: 0; padding: 4px 4px 8px;
    }
    .arch-flow-step {
      display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: stretch;
    }
    .arch-flow-rail {
      display: flex; flex-direction: column; align-items: center;
    }
    .arch-flow-dot {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center; font-size: 12px; font-weight: 700;
      background: var(--accent); color: #fff;
    }
    .arch-flow-line {
      width: 2px; flex: 1; min-height: 12px; background: #cfe3da; margin: 4px 0;
    }
    .arch-flow-step:last-child .arch-flow-line { display: none; }
    .arch-flow-card {
      margin-bottom: 10px; text-align: left; border: 1px solid var(--border); border-radius: 12px;
      background: #fff; padding: 12px 14px; cursor: pointer; color: inherit;
      transition: border-color .12s, box-shadow .12s;
    }
    .arch-flow-card:hover { border-color: #9dc4b5; box-shadow: var(--shadow); }
    .arch-flow-card strong { display: block; font-size: 13px; }
    .arch-flow-card span { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); line-height: 1.45; }
    .arch-note {
      margin-top: 0; padding: 14px 16px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--panel); box-shadow: var(--shadow);
      font-size: 13px; color: var(--muted); line-height: 1.55;
    }
    .arch-note strong { color: var(--text); }
    @media (max-width: 900px) {
      .arch-lanes { grid-template-columns: 1fr; }
    }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 14px;
      padding: 14px 16px; background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 128px; }
    .field.grow { flex: 1; min-width: 160px; }
    .field label { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .02em; }
    .field select, .field input, .field textarea {
      border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #fff;
      transition: border-color .12s, box-shadow .12s; box-sizing: border-box;
    }
    /* 单行输入：固定高度 + 正常行高，避免继承 body 的 1.55 导致文字沉底 */
    .field select, .field input {
      height: 40px; padding: 0 12px; line-height: normal; vertical-align: middle;
    }
    .field select:focus, .field input:focus, .field textarea:focus {
      outline: none; border-color: #9dc4b5; box-shadow: 0 0 0 3px rgba(26,95,74,.12);
    }
    .field input.num-in { font-family: var(--mono); font-size: 12px; text-align: right; }
    .field textarea {
      min-height: 100px; height: auto; padding: 10px 12px;
      font-family: var(--mono); font-size: 12px; line-height: 1.45; resize: vertical;
    }
    .spacer { flex: 1; }

    .panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; margin-bottom: 14px; box-shadow: var(--shadow);
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 13px 18px; border-bottom: 1px solid var(--border); background: #fbfcfd;
    }
    .panel-head h2 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
    .panel-head span { font-size: 12px; color: var(--muted); }
    .table-wrap { overflow: auto; max-height: 480px; }
    table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.data th {
      position: sticky; top: 0; background: #f8fafc; font-weight: 700; color: var(--muted);
      text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; z-index: 1;
    }
    table.data td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    table.data tr.clickable { cursor: pointer; }
    table.data tr.clickable:hover td { background: #f8fafc; }
    table.data tr.selected td { background: var(--accent-soft); }
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; font-family: var(--mono); font-size: 11px; }
    .mono { font-family: var(--mono); font-size: 11px; }
    .tag {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 650;
      background: #f1f5f9; color: #475569;
    }
    .tag.ok { background: #d1fae5; color: #047857; }
    .tag.warn { background: #fef3c7; color: #92400e; }
    .tag.muted { background: #f1f5f9; color: #64748b; }
    .tag.accent { background: var(--accent-soft); color: #134e3a; }
    .req { color: #b4334a; font-size: 11px; }
    .opt { color: #8b97a8; font-size: 11px; }

    .split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
    .split-wide { grid-template-columns: 280px minmax(0, 1fr); }
    .split-3 { grid-template-columns: 230px 1fr 280px; }
    .side {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; position: sticky; top: 72px; box-shadow: var(--shadow);
    }
    .side h3 { margin: 0 0 10px; font-size: 14px; font-weight: 700; }
    .side .field { min-width: 0; margin-bottom: 10px; }
    .side .field textarea { min-height: 72px; }
    .side .btn { width: 100%; }
    .side p, .side li { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .side ul { margin: 0; padding-left: 1.1em; }
    .side .kv { display: grid; grid-template-columns: 88px 1fr; gap: 8px 10px; font-size: 12px; margin: 12px 0; }
    .side .kv dt { color: var(--muted); }
    .side .kv dd { margin: 0; font-weight: 600; color: var(--text); }
    .dsl {
      background: #0f172a; color: #d7e0ea; border-radius: 12px; padding: 14px 16px;
      font-family: var(--mono); font-size: 11px; line-height: 1.6; white-space: pre-wrap; overflow: auto;
    }
    .dsl .kw { color: #7dd3a8; }
    .dsl .val { color: #f0c674; }

    .exp-shell {
      position: relative;
      display: grid; grid-template-columns: 200px minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px; height: calc(100vh - 148px); min-height: 480px;
    }
    .exp-toolbar {
      grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 14px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .exp-toolbar .hint { margin-left: auto; font-size: 12px; color: var(--muted); }
    .exp-tabs {
      display: inline-flex; align-items: center; gap: 2px; padding: 3px;
      background: #f1f5f9; border-radius: 10px; margin-right: 6px;
    }
    .exp-tab {
      border: 0; background: transparent; color: #64748b; cursor: pointer;
      padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 650;
      white-space: nowrap;
    }
    .exp-tab:hover { color: #334155; background: rgba(255,255,255,.55); }
    .exp-tab.active {
      background: #fff; color: #0f3d32; box-shadow: 0 1px 2px rgba(15,23,42,.08);
    }
    .exp-tab .sub {
      display: block; font-size: 10px; font-weight: 500; color: #94a3b8; margin-top: 1px;
    }
    .exp-tab.active .sub { color: #5f8f7f; }
    .exp-nav {
      background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: auto;
      padding: 10px 8px 14px;
    }
    .exp-nav h3 {
      margin: 0; padding: 8px 12px 10px; font-size: 12px; font-weight: 700;
      color: #64748b; letter-spacing: .04em; text-transform: none;
    }
    .exp-float {
      position: absolute; z-index: 20;
      top: 68px; left: calc(200px + 24px); bottom: auto;
      width: min(340px, calc(100% - 248px));
      max-height: calc(100% - 84px);
      display: flex; flex-direction: column;
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .1);
      overflow: hidden; animation: expFloatIn .12s ease-out;
    }
    @keyframes expFloatIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .exp-float-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      padding: 16px 16px 12px;
      background: linear-gradient(180deg, #f7faf9 0%, #fff 100%);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .exp-float-head strong {
      display: block; font-size: 15px; font-weight: 700; line-height: 1.35; color: var(--text);
    }
    .exp-float-head .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .exp-float-close {
      border: 0; background: #f1f5f9; color: #64748b; width: 30px; height: 30px;
      border-radius: 9px; cursor: pointer; font-size: 18px; line-height: 1; flex-shrink: 0;
    }
    .exp-float-close:hover { background: #e2e8f0; color: var(--text); }
    .exp-float-body {
      padding: 12px 14px 16px; overflow: auto; flex: 1; min-height: 0;
      display: flex; flex-direction: column; gap: 10px;
    }
    .exp-float-sec-label {
      margin: 0; font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: .03em;
    }
    .exp-float-sec-desc {
      margin: 4px 0 0; font-size: 11px; line-height: 1.45; color: #64748b; font-weight: 450;
    }
    .exp-float-sec {
      display: flex; flex-direction: column; gap: 8px;
    }
    .exp-float-body .dsl {
      margin: 0; max-height: none; font-size: 11px; line-height: 1.5; border-radius: 12px;
    }
    textarea.exp-json-edit {
      width: 100%; min-height: 200px; margin: 0; resize: vertical; box-sizing: border-box;
      border: 0; border-radius: 12px; padding: 14px 16px;
      background: #0f172a; color: #d7e0ea;
      font-family: var(--mono); font-size: 11px; line-height: 1.5;
    }
    textarea.exp-json-edit:focus { outline: 2px solid #7dd3a8; outline-offset: 0; }
    .exp-json-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .exp-json-err { margin: 0; font-size: 12px; color: #b42318; line-height: 1.45; white-space: pre-wrap; }
    .exp-float.cfg-open { width: min(440px, calc(100% - 248px)); }
    .exp-cfg { display: flex; flex-direction: column; gap: 8px; }
    .exp-cfg .field { margin: 0; }
    .exp-cfg label.k { display: block; margin: 0 0 4px; font-size: 11px; font-weight: 700; color: #64748b; }
    .exp-cfg input[type="text"], .exp-cfg select {
      width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 8px; font-size: 12px; background: #fff; color: var(--text);
    }
    .exp-cfg-row { display: grid; grid-template-columns: minmax(0, 1.2fr) 92px minmax(0, 1fr) 28px; gap: 4px; align-items: center; }
    .exp-cfg-remove {
      border: 0; background: #f1f5f9; color: #64748b; width: 28px; height: 28px; border-radius: 8px;
      cursor: pointer; font-size: 16px; line-height: 1;
    }
    .exp-cfg-remove:hover { background: #fee2e2; color: #b42318; }
    .exp-cfg-check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #334155; }
    .exp-cfg-note { margin: 0; font-size: 11px; line-height: 1.45; color: #9a5b14; }
    .exp-float-calc {
      border: 1px solid #cfe3da; background: #f3faf7; border-radius: 12px; padding: 10px 12px;
    }
    .exp-float-calc .exp-float-sec-label { color: #1a5f4a; margin-bottom: 0; }
    .exp-float-calc .exp-float-sec-desc { color: #3d6b5c; margin-bottom: 4px; }
    .exp-float-calc .dsl {
      background: #0f172a; border: 0; max-height: 280px;
    }
    .exp-float-calc-line {
      font-family: var(--mono); font-size: 12px; color: #134e3a; margin: 0 0 6px; line-height: 1.45;
    }
    .exp-float-calc-line:last-child { margin-bottom: 8px; }
    .exp-nav-item {
      display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;

    .calc-stages {

      background: #fff; cursor: pointer; color: inherit; box-shadow: var(--shadow);
      transition: border-color .12s, background .12s;

    function slugifyProductId(name) {
      const map = { "贷款": "loan", "债券": "bond", "定期": "term", "活期": "demand", "承诺": "commitment" };
      for (const k of Object.keys(map)) {
        if (String(name || "").indexOf(k) >= 0 && !PRODUCTS[map[k]]) return map[k];
      }
      let base = String(name || "type")
        .trim()
        .toLowerCase()
        .replace(/[／/]/g, "_")
        .replace(/[^\w\u4e00-\u9fff]+/g, "_")
        .replace(/^_+|_+$/g, "") || "type";
      if (/^[\u4e00-\u9fff]/.test(base) || !/^[a-zA-Z_]/.test(base)) base = "p_" + base;
      base = base.replace(/[^\w]/g, "_").slice(0, 32) || "type";
      let id = base;
      let n = 2;
      while (PRODUCTS[id]) { id = base + "_" + n; n += 1; }
      return id;
    }

    function findKbProductMatch(prodOrName) {
      const label = typeof prodOrName === "string"
        ? prodOrName
        : ((prodOrName && (prodOrName.label || "")) || "");
      const text = String(label).trim().toLowerCase();
      if (!text) return null;
      let best = null;
      let bestScore = 0;
      KB_PRODUCT_LIBRARY.forEach((tpl) => {
        const names = [tpl.label].concat(tpl.aliases || []).map((x) => String(x).toLowerCase());
        names.forEach((n) => {
          let score = 0;
          if (text === n) score = 100;
          else if (text.indexOf(n) >= 0 || n.indexOf(text) >= 0) score = Math.min(text.length, n.length) + 20;
          if (score > bestScore) { bestScore = score; best = tpl; }
        });
      });
      return bestScore >= 20 ? best : null;
    }

    function syncProductFromKb(productKey, opts) {
      const prod = PRODUCTS[productKey];
      if (!prod) return { ok: false, matched: false, added: 0, msg: "类型不存在" };
      const tpl = findKbProductMatch(prod);
      if (!tpl) {
        prod.kbMatchId = "";
        return {
          ok: true, matched: false, added: 0,
          msg: "知识库暂无与「" + prod.label + "」相关的产品模板，请在本类型下自行维护字段。"
        };
      }
      const keepCustom = !(opts && opts.replaceAll);
      const customKeep = keepCustom ? prod.fields.filter((f) => f.source === "custom") : [];
      const exist = {};
      customKeep.forEach((f) => { exist[f.id] = true; });
      const incoming = cloneFields(tpl.fields).map((f) => {
        f.source = "kb";
        return f;
      }).filter((f) => !exist[f.id]);
      prod.fields = customKeep.concat(incoming);
      prod.kbSpace = tpl.kbSpace;
      prod.kbMatchId = tpl.id;
      if (tpl.classes && tpl.classes.length) prod.classes = tpl.classes.slice();
      incoming.forEach((f) => {
        if (f.zh && !FIELD_LABEL[f.id]) FIELD_LABEL[f.id] = f.zh;
      });
      return {
        ok: true, matched: true, added: incoming.length, template: tpl,
        msg: "已匹配知识库「" + tpl.label + "」，同步 " + incoming.length + " 个字段"
          + (customKeep.length ? "（保留自维护 " + customKeep.length + " 个）" : "") + "。"
      };
