        + "<label class=\"exp-cfg-check\"><input type=\"checkbox\" data-exp-cfg-otherwise" + (logic.otherwise ? " checked" : "") + " /> 本层都不成立时走这里</label>"
        + (leaf
          ? ("<div class=\"field\"><label class=\"k\">权重</label>"
            + "<input type=\"text\" data-exp-cfg-weight value=\"" + esc(weight) + "\" placeholder=\"如 250% 或 按交易对手\" /></div>")
          : (hasKids ? "<p class=\"exp-cfg-note\">这一级已经有下级，权重写在下级里。</p>" : ""))

    function expCfgReadForm() {
      const root = document.getElementById("expCfg");
      if (!root || !expCfgDraft) return;
      const draft = expCfgDraft;
      const labelEl = root.querySelector("[data-exp-cfg-label]");
      const questionEl = root.querySelector("[data-exp-cfg-question]");
      const joinEl = root.querySelector("[data-exp-cfg-join]");
      const otherwiseEl = root.querySelector("[data-exp-cfg-otherwise]");
      const weightEl = root.querySelector("[data-exp-cfg-weight]");
      if (labelEl) draft.label = labelEl.value;
      if (questionEl) draft.question = questionEl.value;
      if (otherwiseEl) draft.otherwise = !!otherwiseEl.checked;
      if (weightEl) {
        draft.then = draft.then || {};
        draft.then.risk_weight = weightEl.value.trim();
        if (!draft.then.sub_class) draft.then.sub_class = draft.label;
      }
      const condRoot = document.getElementById("expCfgConds");
      if (condRoot && joinEl) {
        const items = [];
        condRoot.querySelectorAll("[data-exp-cfg-row]").forEach(function (row) {
          const field = (row.querySelector("[data-exp-cfg-field]").value || "").trim();
          const op = row.querySelector("[data-exp-cfg-op]").value || "eq";
          const value = expCfgParseValue(op, row.querySelector("[data-exp-cfg-value]").value);
          items.push({ field: field, op: op, value: value });
        });
        draft.when = joinEl.value === "any" ? { any: items } : { all: items };
      }
      const ta = document.getElementById("expNodeJson");
      if (ta) ta.value = prettyJson(draft);
    }

    function expCfgWriteForm() {
      const root = document.getElementById("expCfg");
      const ta = document.getElementById("expNodeJson");
      if (!root || !ta) return;
      let parsed;
      try { parsed = JSON.parse(ta.value); } catch (e) { return; }
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return;
      expCfgDraft = parsed;
      const labelEl = root.querySelector("[data-exp-cfg-label]");
      const questionEl = root.querySelector("[data-exp-cfg-question]");
      const joinEl = root.querySelector("[data-exp-cfg-join]");
      const otherwiseEl = root.querySelector("[data-exp-cfg-otherwise]");
      const weightEl = root.querySelector("[data-exp-cfg-weight]");
      if (labelEl && parsed.label != null) labelEl.value = String(parsed.label);
      if (questionEl && parsed.question != null) questionEl.value = String(parsed.question);
      if (otherwiseEl) otherwiseEl.checked = !!parsed.otherwise;
      if (weightEl && parsed.then && parsed.then.risk_weight != null) weightEl.value = String(parsed.then.risk_weight);
      const pack = expCfgPack(parsed.when);
      if (joinEl) joinEl.value = pack.join === "any" ? "any" : "all";
      const condRoot = document.getElementById("expCfgConds");
      if (condRoot && !pack.nested) {
        const items = pack.items.length ? pack.items : [{}];
        condRoot.innerHTML = items.map(expCfgRowHtml).join("");
      }
    }

      }[sel.kind] || sel.kind || "";

          + (logic.calc.rwa && logic.calc.rwa.expr

          + "<textarea id=\"expNodeCalcJson\" class=\"exp-json-edit\" spellcheck=\"false\">"

              ? "② 路由回执"
              : "② 节点逻辑（判定 / 路由）")))));
      const logicDesc = configurable
        ? "改上面的配置，这里会跟着变；改这里，上面的配置也会跟着变。保存后写回这棵树。"
        : (sel.id === "step:route" || (sel.kind === "result" && sel.id !== "res:rw")

        : (sel.kind === "rule"
        ? "可以直接改汇总公式，保存后写回。"

          ? "可以直接改定权结果，保存后写回当前规则。"
          : (sel.kind === "onbook" || sel.kind === "ccf"
            ? "可以直接改表内或表外公式，保存后写回计算模板。"
            : (sel.kind === "result"
              ? "可以直接改这份回执，保存后按你写的执行。"
              : "可以直接改 when / then / 权重。保存后写回这条规则。")))));
      const routeStep = findRawExpNode("step:route");
      const manual = !!(routeStep && routeStep.node && routeStep.node.manual_decision);
      return "<aside class=\"exp-float" + (configurable ? " cfg-open" : "") + "\" role=\"dialog\" aria-label=\"节点详情\">"
        + "<div class=\"exp-float-head\">"

        + (purpose ? "<p class=\"exp-float-sec-desc\" style=\"margin-top:6px\">" + esc(purpose) + "</p>" : "")

          ? ("<div class=\"exp-float-sec\"><p class=\"exp-float-sec-label\">配置</p>"
            + "<p class=\"exp-float-sec-desc\">改这里会写进下面的 JSON。保存后画布跟着变。</p>"
            + cfgBlock + "</div>")
          : "")
        + calcBlock
        + "<div class=\"exp-float-sec\">"
        + "<p class=\"exp-float-sec-label\">" + esc(logicTitle) + "</p>"

        + (state.expJsonErr ? "<p class=\"exp-json-err\" id=\"expNodeJsonErr\">" + esc(state.expJsonErr) + "</p>" : "<p class=\"exp-json-err\" id=\"expNodeJsonErr\"></p>")
        + "<div class=\"exp-json-actions\">"
        + "<button type=\"button\" class=\"btn btn-primary\" data-exp-json-save>" + (configurable ? "保存到分类树" : "保存 JSON") + "</button>"
        + (manual ? "<button type=\"button\" class=\"btn\" data-exp-json-reset>恢复自动校验</button>" : "")
        + "</div>"
        + "</div>"
        + "</div></aside>";
    }

    function prettyJson(obj) {
      try { return JSON.stringify(obj, null, 2); } catch (e) { return String(obj); }
    }

    function flattenMatch(match) {
      if (!match) return [];
      if (Array.isArray(match)) return match;
      if (Array.isArray(match.all)) return match.all;
      if (Array.isArray(match.any)) return match.any;
      return [match];
    }

    function collectLogicFields(v, out) {
      if (v == null) return;
      if (Array.isArray(v)) {
        v.forEach((x) => collectLogicFields(x, out));
        return;
      }
      if (typeof v !== "object") return;
      if (typeof v.field === "string") out[v.field] = true;
      if (typeof v.var === "string") out[v.var] = true;
      if (v.lookup && typeof v.key === "string") out[v.key] = true;
      Object.keys(v).forEach((k) => {
        if (k === "display" || k === "label" || k === "type" || k === "id" || k === "note") return;
        collectLogicFields(v[k], out);
      });
    }

    function formulaCalcText(f) {
      if (f == null) return null;
      if (typeof f === "string") return f;
      if (f.display) return f.display;
      if (f.ref) return "引用 " + f.ref;
      if (f.op === "sub" && f.args) return (f.args.map(formulaCalcText).join(" − "));
      if (f.op === "mul" && f.args) return (f.args.map(formulaCalcText).join(" × "));
      if (f.op === "sum" && f.args) return "Σ(" + f.args.map(formulaCalcText).join(", ") + ")";
      if (f.var) return f.var;
      if (f.lookup) return "lookup(" + f.lookup + ", " + f.key + ")";
      try { return JSON.stringify(f); } catch (e) { return String(f); }
    }

    function rwLogicText(rw) {
      if (rw == null) return null;
      if (typeof rw === "string" || typeof rw === "number") return String(rw);
      if (rw.display) return rw.display;
      if (rw.type === "const" && rw.value != null) return ((rw.value * 100) + "%");
      if (rw.type === "lookup") return "lookup(" + rw.table + ", " + rw.key + ")";
      if (rw.type === "formula") return formulaCalcText(rw.expr) || rw.display;
      return formulaCalcText(rw);
    }

    /** 用户可读的逻辑 JSON：字段、判定、公式与怎么算；不含样式 / 画布信息 */
    function logicViewOfFlow(flow) {
      if (!flow) return {};
      if (flow.mode === "ref" || flow.ref === true) {
        return {
          mode: "ref",
          based_on: flow.based_on || BASE_EXP_TEMPLATE.id,
          note: "引用通用流程的字段判定与计算公式",
          resolves_to: logicViewOfFlow(flow.resolves_to || BASE_EXP_TEMPLATE)
        };
      }
      const formulas = {};
      const allFields = {};
      Object.keys(flow.formulas || {}).forEach((k) => {
        const f = flow.formulas[k];
        const fields = {};
        collectLogicFields(f, fields);
        Object.keys(fields).forEach((x) => { allFields[x] = true; });
        formulas[k] = {
          calc: formulaCalcText(f),
          fields: Object.keys(fields),
          op: f.op,
          args: f.args
        };
      });
      const layers = (flow.categories || []).map((cat) => {
        collectLogicFields(cat.match, allFields);
        return {
          id: cat.id,
          label: cat.label,
          question: cat.question,
          when: flattenMatch(cat.match),
          if_yes: (function mapKids(list) {
            return (list || []).map(function (ch) {
              collectLogicFields(ch.match, allFields);
              const then = ch.then || {};
              const row = {
                id: ch.id,
                label: ch.label,
                rule_id: ch.rule_id || ch.rule,
                priority: ch.priority,
                otherwise: ch.otherwise || undefined,
                when: flattenMatch(ch.match),
                then: {
                  exposure_class: then.exposure_class || "",
                  sub_class: then.sub_class || ch.label || "",
                  risk_weight: rwLogicText(then.risk_weight) || ch.rw || null
                }
              };
              if (ch.children && ch.children.length) row.if_yes = mapKids(ch.children);
              return row;
            });
          })(cat.children)
        };
      });
      return {
        id: flow.id,
        name: flow.name,
        meta: flow.meta || null,
        fields_used: Object.keys(allFields).sort(),
        formulas: formulas,
        books: (flow.books || []).map((s) => ({
          id: s.id,
          kind: s.kind,
          label: s.label,
          note: s.note || "",
          when: s.when || null,
          formula_ref: s.formula_ref || null
        })),
        layers: layers,
        tail: (flow.tail || []).map((s) => ({
          id: s.id,
          kind: s.kind,
          label: s.label,
          note: s.note || "",
          formula_ref: s.formula_ref || null
        }))
      };
    }

    function logicViewOfOverview(master) {
      const m = master || buildOverviewMasterJson();
      return {
        id: m.id,
        name: m.name,
        note: m.note || "识别产品后进入对应线路的判定与公式",
        fields_used: ["product_type"],
        routes: (m.routes || []).map((r) => ({
          product: r.label,
          product_id: r.product_id,
          when: flattenMatch(r.match),
          flow: r.flow && r.flow.mode === "ref"
            ? { mode: "ref", based_on: r.flow.based_on, note: "使用通用流程的字段与公式" }
            : { mode: "override", flow_id: r.flow && r.flow.flow_id, note: "本产品独立公式" }
        }))
      };
    }

    function isLogicFlowJson(obj) {
      return !!(obj && Array.isArray(obj.layers) && !Array.isArray(obj.categories));
    }

    function parseRwLogic(text) {
      if (text == null) return { type: "unspecified", display: "权重表未列明" };
      if (typeof text === "object") return text;
      const s = String(text).trim();
      if (!s || s.indexOf("未列明") >= 0) return { type: "unspecified", display: s || "权重表未列明" };
      if (s.indexOf("交易对手") >= 0 || s.indexOf("较大值") >= 0) return rwFollow(s);
      const m = s.match(/^([\d.]+)\s*%?$/);
      if (m) {
        const n = parseFloat(m[1]);
        const rate = n > 1.5 && s.indexOf("%") >= 0 ? n / 100 : (n > 3 ? n / 100 : n);
        return rwConst(rate, s.indexOf("%") >= 0 ? s : ((rate * 100) + "%"));
      }
      if (s.indexOf("lookup(") === 0) return { type: "lookup", display: s };
      return { type: "unspecified", display: s };
    }

    function logicJsonToFlow(parsed, fallback) {
      const base = fallback ? cloneExpFlow(fallback) : cloneExpFlow(BASE_EXP_TEMPLATE);
      base.id = parsed.id || base.id;
      base.name = parsed.name || base.name;
      base.ref = false;
      base.customized = true;
      if (parsed.formulas && typeof parsed.formulas === "object") {
        base.formulas = base.formulas || {};
        Object.keys(parsed.formulas).forEach((k) => {
          const src = parsed.formulas[k] || {};
          if (src.op || src.args) {
            base.formulas[k] = {
              op: src.op,
              args: src.args,
              display: src.calc || src.display || (base.formulas[k] && base.formulas[k].display)
            };
          } else if (src.calc || src.display) {
            base.formulas[k] = Object.assign({}, base.formulas[k] || {}, {
              display: src.calc || src.display
            });
          }
        });
      }
      if (Array.isArray(parsed.layers)) {
        base.categories = parsed.layers.map((layer) => ({
          id: layer.id,
          type: "gate",
          label: layer.label,
          question: layer.question,
          match: { all: flattenMatch(layer.when || layer.match) },
          on_match: "expand_children",
          on_miss: "next_layer",
          children: (layer.if_yes || layer.children || []).map((ch) => {
            const then = ch.then || {};

      return PARAMS.find(function (p) { return p.id === id; }) || null;
    }

    function paramShown(id) {
      const p = paramById(id);
      if (!p) return id;
      if (p.unit && p.unit !== "%" && p.unit !== "RW") return p.value + p.unit;
      return p.value;
    }

    function condParamId(c) {
      if (!c) return "";
      if (c.param) return c.param;
      if (c.value && typeof c.value === "object" && c.value.param) return c.value.param;
      return "";
    }

    function condOperator(c) {
      return (c && (c.operator || c.op)) || "=";
    }

    function condValueText(c) {
      const param = condParamId(c);
      if (param) return paramShown(param);
      const v = c.value;
      if (Array.isArray(v)) return v.join(" | ");
      if (typeof v === "boolean") return v ? "true" : "false";
      return v == null ? "" : String(v);
    }

    function condText(conds) {
      return (conds || []).map(function (c) {
        if (c.text && !c.field) return c.text;
        const name = FIELD_LABEL[c.field] || c.field || "";
        return name + " " + condOperator(c) + " " + condValueText(c);
      }).filter(Boolean).join(" · ");
    }

    function parseWeightNumber(text) {
      const raw = String(text == null ? "" : text).trim();
      const n = parseFloat(raw.replace("%", ""));
      if (!Number.isFinite(n)) return null;
      return raw.indexOf("%") >= 0 || n > 1 ? n / 100 : n;
    }

    function inferWeightResult(rw) {
      const text = String(rw || "");
      if (text.indexOf("未列明") >= 0) return { type: "unspecified", display: "权重表未列明" };
      if (text.indexOf("较大值") >= 0) return { type: "max", display: "90%", with: "counterparty" };
      if (text.indexOf("交易对手") >= 0) return { type: "counterparty", display: "按交易对手" };
      return { type: "const", display: text };
    }

    function resultText(result) {
      if (!result) return "";
      if (result.type === "counterparty") return "按交易对手";
      if (result.type === "max") return (result.display || "90%") + " 与交易对手较大值";
      if (result.type === "unspecified") return "权重表未列明";
      return result.display || "";
    }

    function syncWeightText(w) {
      w.cond = (w.conds && w.conds.length) ? condText(w.conds) : "本类其余";
      if (w.result) w.rw = resultText(w.result);
      return w;
    }

    function syncCcfText(r) {
      r.cond = r.note || ((r.conds && r.conds.length) ? ccfCondText(r.conds) : "一般");
      return r;
    }

    function crmEffect(r) {
      let text = CRM_SUBSTITUTE[r.substitute] || "覆盖部分另取权重";
      if (r.floorParam) {
        text += "。一般不低于参数 " + r.floorParam + "（当前 " + paramShown(r.floorParam) + "），特定回购可豁免";
      }
      const c = r.constraints || {};
      const bits = [];
      if (c.maturity && r.substitute === "guarantor") bits.push("剩余期限短于风险暴露的，不具备缓释作用");
      else if (c.maturity) bits.push("期限短于风险暴露的，需按规定调整");
      if (c.currency) bits.push("币种错配时要调整");
      if (c.correlation) bits.push("与债务人信用风险高度正相关时，缓释效果受限");
      if (bits.length) text += "。" + bits.join("；");
      text += "。未覆盖部分仍用原风险暴露的权重";
      return text;
    }

    function bankGridRules() {
      const out = [];
      BANK_GRID.rows.forEach(function (row) {
        BANK_GRID.grades.forEach(function (grade, i) {
          const conds = [

            { field: "counterparty_rating", operator: "=", value: grade }

          if (row.extra) conds.push(row.extra);
          if (row.param) conds.push({ field: row.field || "original_maturity", operator: "≤", value: { param: row.param } });
          out.push(syncWeightText({
            id: row.ids[i],
            cls: "金融机构",
            exposure_class: "BANK",
            conds: conds,
            result: { type: "const", display: row.weights[i], risk_weight: parseWeightNumber(row.weights[i]) },
            pri: row.pri,
            bank: "第一档",
            basis: row.basis + " · " + grade,
            grid: { row: row.id, col: i }
          }));
        });
      });
      return out;
    }

    function allWeightRows() {
      const out = [];

      WEIGHTS.forEach(function (w) {
        if (w.cls === "金融机构" && !injected) {

    function rulesUsingField(id) {
      const hits = [];
      allWeightRows().forEach(function (w) {

      CCF_RULES.forEach(function (r) {

          if (c.field === id) hits.push(r.id);
        });
      });
      if (id === "collateral_type" || id === "collateral_value") hits.push("合格质物");
      if (id === "guarantee_type" || id === "guarantee_amount") hits.push("合格保证");
      if (id === "remaining_maturity" || id === "currency") hits.push("缓释约束");
      const seen = {};
      return hits.filter(function (x) {
        if (seen[x]) return false;
        seen[x] = true;
        return true;
      });
    }

    const DOC_OP = { eq: "=", neq: "≠", lt: "<", lte: "≤", gt: ">", gte: "≥", in: "in" };

    function leafByRuleId() {
      const map = {};
      (BASE_EXP_TEMPLATE.categories || []).forEach(function (cat) {
        (cat.children || []).forEach(function (ch) {
          if (ch.rule_id) map[ch.rule_id] = ch;
        });

      return map;

    function paramForLeafValue(field, op, value, exposure) {
      if (field === "original_maturity" && op === "lte" && value === 3) return "SHORT_3M";
      if (field === "original_maturity" && op === "lte" && value === 6) return "TRADE_6M";
      if (field === "provision_ratio" && (value === 0.2 || value === 20)) return "DEF_PROV";
      if (field !== "ltv") return "";
      const n = Number(value);
      if (exposure === "RE_RESIDENTIAL" && (n === 0.5 || n === 50)) return "LTV_RES_50";
      if (exposure === "RE_RESIDENTIAL" && (n === 1 || n === 100)) return "LTV_RES_100";
      if (exposure === "RE_COMMERCIAL" && (n === 0.6 || n === 60)) return "LTV_CRE_60";
      if (exposure === "RE_COMMERCIAL" && (n === 0.8 || n === 80)) return "LTV_CRE_80";
      return "";
    }

    function condFromLeaf(c, exposure) {
      const operator = DOC_OP[c.op] || c.op || "=";
      const param = paramForLeafValue(c.field, c.op, c.value, exposure);
      if (param) return { field: c.field, operator: operator, value: { param: param } };
      return { field: c.field, operator: operator, value: c.value };
    }

    function resultFromLeaf(rw) {
      const src = rw || {};
      if (src.type === "counterparty") return { type: "counterparty", display: "按交易对手" };
      if (src.type === "max") return { type: "max", display: "90%", with: "counterparty", risk_weight: typeof src.with === "number" ? src.with : 0.9 };
      if (src.type === "unspecified") return { type: "unspecified", display: "权重表未列明" };
      const n = typeof src.value === "number" ? src.value : parseWeightNumber(src.display);
      return { type: "const", display: src.display || ((n != null ? (n * 100) + "%" : "")), risk_weight: n };
    }

    function weightRuleDoc(w) {
      const conditions = (w.conds || []).filter(function (c) { return c.field; }).map(function (c) {
        const param = condParamId(c);
        return {
          field: c.field,
          operator: condOperator(c),
          value: param ? { param: param } : c.value
        };
      });
      const result = {};
      if (w.result && w.result.type && w.result.type !== "const") result.type = w.result.type;
      if (w.result && typeof w.result.risk_weight === "number") result.risk_weight = w.result.risk_weight;
      else if (!result.type && w.result && w.result.type === "const") result.risk_weight = parseWeightNumber(w.result.display || w.rw);
      return {
        rule_id: w.id,
        exposure_class: w.exposure_class || "",
        conditions: conditions,
        result: result,
        priority: w.pri
      };
    }

    function ccfCondText(conds) {

        if (Array.isArray(shown)) shown = shown.join(" | ");
        return name + " " + condOperator(c) + " " + shown;

    function crmRuleDoc(r) {
      const c = r.constraints || {};
      const tail = {
        eligible: true,
        maturity_match: !!c.maturity,

      if (r.substitute === "guarantor") {

      }
      if (r.substitute === "provider") {
        return Object.assign({ crm_id: r.id, type: "CDS", protection_type: r.tool }, tail);
      }
      return Object.assign({ crm_id: r.id, type: "COLLATERAL", collateral_type: r.tool }, tail);
    }

    /** 解析标准字段当前映射到的 Excel 列 / 常量，并给出取值示意 */
    function resolveFieldAssign(fieldId, fallbackSample) {

        return { assign: "", value: String(fallbackSample == null || fallbackSample === "" ? "—" : fallbackSample), kind: "none" };
      }

      const col = (currentUpload().columns || []).find((c) => c.letter === assign);

    function classifyResultOptions() {
      const opts = [];
      function walk(nodes, catLabel) {
        (nodes || []).forEach(function (node) {
          const kids = node.children || [];
          const category = catLabel || node.label;
          if (!kids.length) {
            const rw = node.then && node.then.risk_weight;
            opts.push({
              category: category,
              subclass: node.label,
              ruleId: node.id || node.rule_id || "",
              weightRule: node.id || node.rule_id || "",
              rwHint: (rw && rw.display) || node.rw || "—"
            });
            return;
          }
          walk(kids, category);
        });
      }
      walk(classifyTreeCategories(), "");
      return opts;
    }

    function instrumentFromText(prod) {
      const code = optionCode("instrument_type", prod);
      if (code) return code;
      if (/黄金/.test(prod)) return "gold";
      if (/现金/.test(prod)) return "cash";
      if (/股权|股票/.test(prod)) return "equity";
      if (/资产担保债券|covered/i.test(prod)) return "covered_bond";
      if (/其他资产|固定资产|无形资产/.test(prod)) return "other_asset";
      return "claim";
    }

    function maturityMonths(text) {
      const raw = String(text || "").trim();
      if (!raw) return null;
      const year = raw.match(/^(\d+(?:\.\d+)?)\s*(Y|年)$/i);
      if (year) return Number(year[1]) * 12;
      const month = raw.match(/^(\d+(?:\.\d+)?)\s*(M|月)$/i);
      if (month) return Number(month[1]);
      const n = parseSheetNumber(raw);
      return n != null && n < 600 ? n : null;
    }

    function optionCode(fieldId, text) {
      const raw = String(text || "").trim();
      if (!raw) return "";
      const field = (state.classFields || []).filter(function (item) { return item.id === fieldId; })[0];
      if (!field) return "";
      const hit = (field.options || []).filter(function (opt) {
        return String(opt.code) === raw || String(opt.label) === raw;
      })[0];
      return hit ? String(hit.code) : "";
    }

    function factsFromUploadRow(row) {
      const prod = assignedValue(row, "instrument_type") || assignedValue(row, "product_sub_type") || assignedValue(row, "product_type") || uploadCell(row, "product_sub_type", /业务品种|产品细类|产品名称/);

      const rating = assignedValue(row, "issuer_rating") || assignedValue(row, "counterparty_rating");

      if (/第二档/.test(note)) facts.bank_tier = "tier2";
      else if (/第一档/.test(note)) facts.bank_tier = "tier1";
      if (grade === "正常") facts.loan_classification_normal = "yes";
      const cpCode = optionCode("counterparty_type", cp);
      const cpNorm = String(cp || "").trim();
      if (cpCode) facts.counterparty_type = cpCode;
      else if (/^BANK$/i.test(cpNorm) || /银行/.test(cp) || /同业|存放/.test(prod)) facts.counterparty_type = "commercial_bank";
      else if (/SOVEREIGN|主权/i.test(cpNorm) || /财政部|中央政府/.test(note)) {
        facts.counterparty_type = /外国|境外|其他国家/.test(note) ? "foreign_sovereign" : "cn_central_government";
      } else if (/^P$/i.test(cpNorm) || /个人|自然人/.test(cp)) facts.counterparty_type = "individual";
      else if (/^C$/i.test(cpNorm) || /公司|企业/.test(cp)) facts.counterparty_type = "corporate";
      if (/居住|住房|按揭|RESIDENTIAL/i.test(blob)) {
        facts.has_property_collateral = "yes";
        facts.property_uses = ["residential"];
        facts.cashflow_dependent = "no";
      }
      if (/商用|物业/.test(blob)) {
        facts.has_property_collateral = "yes";
        facts.property_uses = ["commercial"];
        facts.cashflow_dependent = /租金|现金流/.test(blob) ? "yes" : "no";
      }
      const ltv = parseSheetNumber(assignedCell(row, "ltv") || uploadCell(row, "ltv", /LTV|贷款价值比|抵质押率/i));
      if (ltv != null) facts.ltv = ltv > 3 ? ltv / 100 : ltv;
      const balance = parseSheetNumber(assignedValue(row, "single_exposure") || assignedValue(row, "balance") || uploadCell(row, "balance", /贷款余额|账面余额|余额|本金|principal/i));
      const provision = parseSheetNumber(assignedValue(row, "impairment") || uploadCell(row, "impairment", /减值准备|减值|损失准备/));
      const ratioCell = assignedCell(row, "provision_ratio");
      if (ratioCell) {
        const ratio = parseSheetNumber(ratioCell);
        if (ratio != null && balance != null && balance > 0 && ratio > 1) facts.provision_ratio = ratio / balance;
        else if (ratio != null) facts.provision_ratio = ratio > 1 ? ratio / 100 : ratio;
      } else if (balance != null && provision != null && balance > 0) {
        facts.provision_ratio = provision / balance;

      if (balance != null) facts.single_exposure = balance;
      const dpd = parseSheetNumber(uploadCell(row, "", /DPD|逾期天数/));
      if (dpd != null && dpd > 90) facts.is_defaulted = "yes";
      const months = maturityMonths(assignedValue(row, "original_maturity_months") || assignedValue(row, "original_maturity") || assignedValue(row, "maturity") || uploadCell(row, "original_maturity", /原始期限|期限|maturity/i));
      if (months != null) facts.original_maturity_months = months;
      if (facts.single_exposure != null) {

        if (total > 0) facts.exposure_share = facts.single_exposure / total;

      if (/信用卡/.test(prod)) facts.is_credit_card = "yes";
      if (/不依赖/.test(note)) facts.cashflow_dependent = "no";
      if (/贷款|按揭|物业|承诺|透支|额度|信用卡|票据/.test(prod) && !/同业|存放/.test(prod)) facts.fi_bank_applicable = "not_applicable";
      return facts;
    }

    function condExpected(cond) {
      if (!cond) return undefined;
      return cond.value != null ? cond.value : cond.match;
    }

    function matchTreeCond(cond, facts) {
      if (!cond || !cond.field) return false;
      if (!Object.prototype.hasOwnProperty.call(facts, cond.field)) return false;
      const actual = facts[cond.field];
      if (actual == null || actual === "") return false;
      const op = cond.op || "eq";
      const expected = condExpected(cond);
      if (op === "eq") return actual === expected || String(actual) === String(expected);
      if (op === "neq") return String(actual) !== String(expected);
      if (op === "in") {
        const list = Array.isArray(expected) ? expected : [expected];
        return list.some(function (item) { return item === actual || String(item) === String(actual); });
      }
      if (op === "contains") {
        const list = Array.isArray(actual) ? actual : String(actual).split(/[,，]/);
        return list.some(function (item) { return item === expected || String(item) === String(expected); });
      }
      const left = Number(actual);
      const right = Number(expected);
      if (!isFinite(left) || !isFinite(right)) return false;
      if (op === "gt") return left > right;
      if (op === "gte") return left >= right;
      if (op === "lt") return left < right;
      if (op === "lte") return left <= right;
      return false;
    }

    function matchTreeWhen(when, facts) {
      if (!when || typeof when !== "object") return false;
      if (Array.isArray(when.all)) {
        return when.all.length > 0 && when.all.every(function (item) { return matchTreeItem(item, facts); });
      }
      if (Array.isArray(when.any)) {
        return when.any.length > 0 && when.any.some(function (item) { return matchTreeItem(item, facts); });
      }
      if (when.field) return matchTreeCond(when, facts);
      return false;
    }

    function matchTreeItem(item, facts) {
      if (!item || typeof item !== "object") return false;
      if (item.all || item.any) return matchTreeWhen(item, facts);
      return matchTreeCond(item, facts);
    }

    function treeNodeSkipped(node, facts) {
      const skip = node && node.skip;
      if (!skip || !skip.field) return false;
      return matchTreeCond({ field: skip.field, op: skip.op || "eq", value: skip.match != null ? skip.match : skip.value }, facts);
    }

    function treeWeightOf(node) {
      const rw = node && node.then && node.then.risk_weight;
      if (!rw) return { type: "unspecified", display: (node && node.rw) || "权重未单列" };
      if (rw.type === "const" && typeof rw.value === "number") return { type: "const", value: rw.value, display: rw.display || ((rw.value * 100) + "%") };
      if (rw.type === "counterparty") return { type: "counterparty", display: rw.display || "按交易对手" };
      if (rw.type === "max") return { type: "max", floor: typeof rw.with === "number" ? rw.with : 0.9, display: rw.display || "较大值" };
      return { type: rw.type || "unspecified", display: rw.display || "权重未单列" };
    }

    function walkExposureLevel(nodes, facts) {
      const active = [];
      let skippedWouldHit = false;
      (nodes || []).forEach(function (node) {
        if (treeNodeSkipped(node, facts)) {
          if (matchTreeWhen(node.match, facts)) skippedWouldHit = true;
          return;
        }
        active.push(node);
      });
      let whenHit = false;
      for (let i = 0; i < active.length; i++) {
        const node = active[i];
        if (node.otherwise) {
          if (whenHit || skippedWouldHit) continue;
        } else if (!matchTreeWhen(node.match, facts)) {
          continue;
        } else {
          whenHit = true;
        }
        const kids = node.children || [];
        if (kids.length) {
          const child = walkExposureLevel(kids, facts);
          if (child && child.cancelled) {
            whenHit = false;
            continue;
          }
          if (child && child.node) return { node: child.node, path: [node].concat(child.path) };
          return { node: node, path: [node] };
        }
        return { node: node, path: [node] };
      }
      if (!whenHit && skippedWouldHit) return { cancelled: true };
      return null;
    }

    function ordinaryClaimFacts(facts) {
      const next = Object.assign({}, facts);
      next.instrument_type = "claim";
      next.treat_as_equity = "no";
      next.is_defaulted = "no";
      next.is_subordinated = "no";
      next.has_property_collateral = "no";
      delete next.property_uses;
      delete next.cashflow_dependent;
      delete next.ltv;
      return next;
    }

    /** 按知识库决策树走一笔。第一条命中再进下级；不适用的分支跳过，且不落入同一层兜底。 */
    function classifyFacts(facts, ordinary) {
      const walked = walkExposureLevel(classifyTreeCategories(), facts);
      if (!walked || !walked.node) {
        return { category: "未归类", subclass: "未归类", path: ["未归类"], ruleId: "unclassified", weightRule: "unclassified", rwHint: "—", rwRate: null };
      }
      const node = walked.node;
      const labels = walked.path.map(function (item) { return item.label; });
      let weight = treeWeightOf(node);
      let rwRate = weight.type === "const" ? weight.value : null;
      if (!ordinary && (weight.type === "counterparty" || weight.type === "max")) {
        const again = classifyFacts(ordinaryClaimFacts(facts), true);
        const other = again && typeof again.rwRate === "number" ? again.rwRate : null;
        if (weight.type === "counterparty") {
          rwRate = other;
          weight = { display: other == null ? "按交易对手" : ((other * 100) + "%") };
        } else {
          rwRate = other == null ? weight.floor : Math.max(weight.floor, other);
          weight = { display: (rwRate * 100) + "%" };
        }
      }
      return {
        category: labels[0] || node.label,
        subclass: labels[labels.length - 1] || node.label,
        path: labels,
        ruleId: node.id || node.rule_id || "",
        weightRule: node.id || node.rule_id || "",
        rwHint: weight.display || "—",
        rwRate: rwRate
      };
    }

    /** 按上传明细行，用决策树给出分类标签 */
    function suggestRowClassifyTag(row) {
      const hit = classifyFacts(factsFromUploadRow(row));
      return hit ? classifyTagKey(hit) : "";
    }

    function seedClassifyTags() {
      if (!state.classifyPick) state.classifyPick = {};
      if (!state.classifyTags) state.classifyTags = {};
      uploadDetailRows().forEach((row) => {
        if (state.classifyPick[row.id] == null) state.classifyPick[row.id] = true;
        if (!state.classifyTags[row.id]) state.classifyTags[row.id] = suggestRowClassifyTag(row);
      });
    }

    /** 试算按知识库决策树给定分类和权重 */
    function classifyLeg(leg) {
      if (leg && leg.paperClass) return leg.paperClass;
      if (leg && leg.facts) return classifyFacts(leg.facts);
      return classifyFacts(factsFromLeg(leg));
    }

    /** 合并人工覆盖后的分类结果（供试算 / 展示） */
    function effectiveClassify(leg) {
      const auto = classifyLeg(leg);
      const ov = (state.classifyOverride || {})[leg.id];
      if (!ov || !ov.manual) return auto;
      return Object.assign({}, auto, {
        category: ov.category || auto.category,
        subclass: ov.subclass || auto.subclass,
        ruleId: ov.ruleId || auto.ruleId,
        weightRule: ov.weightRule || auto.weightRule,
        rwHint: ov.rwHint || auto.rwHint,
        manual: true
      });
    }

    function applyCrmApp(app, remain) {
      const rule = CRM_RULES.find(function (r) { return r.id === app.ruleId; }) || CRM_RULES[0];
      const steps = [];
      let cover = Math.max(0, Number(app.coverageYi) || 0);
      if (!app.eligible) {
        steps.push("不合格，覆盖不计入");
        cover = 0;
      } else {
        steps.push("合格");
        steps.push("覆盖 " + cover);
      }
      if (app.eligible && rule.constraints && rule.constraints.maturity && !app.maturityMatch) {
        steps.push("期限短于暴露，本工具不生效");
        cover = 0;
      } else if (app.eligible) {
        steps.push("期限匹配");
      }
      if (app.eligible && rule.constraints && rule.constraints.currency && !app.currencyMatch) {
        steps.push("币种不匹配，本工具不生效");
        cover = 0;
      } else if (app.eligible && rule.constraints && rule.constraints.currency) {
        steps.push("币种匹配");
      } else if (app.eligible) {
        steps.push("质物币种错配不调整");
      }
      if (app.eligible && rule.constraints && rule.constraints.correlation && app.correlated) {
        steps.push("与债务人高度正相关，缓释不生效");
        cover = 0;
      }
      const hair = Math.min(1, Math.max(0, Number(app.haircut) || 0));
      const adjusted = cover * (1 - hair);
      if (app.eligible) steps.push(hair > 0 ? ("折扣 " + pct(hair) + "，调整后 " + adjusted) : "折扣 0，调整后 " + adjusted);
      let rw = weightRateById(app.rwRuleId);
      if (rw == null) rw = 0;
      const floor = floorRate();
      if (cover > 0 && rule.floorParam && !app.floorExempt && rw < floor) {
        steps.push("底线 " + pct(floor));
        rw = floor;
      } else if (cover > 0 && rule.floorParam && app.floorExempt) {
        steps.push("特定回购豁免底线，沿用 " + pct(rw));
      }
      const amount = Math.min(adjusted, Math.max(0, remain));
      if (adjusted > remain + 1e-9) steps.push("超过剩余暴露，截到 " + amount);
      if (amount > 0) steps.push("替代权重 " + (app.rwRuleId || "") + " " + pct(rw) + "，原权重不改");
      const shortName = rule.id === "CRM_COL_GOV" ? "国债质押" : (rule.id === "CRM_GUAR_PSE" ? "公共部门保证" : rule.type);
      return {
        name: shortName, amount: amount, rw: rw, rule: rule.id,
        note: steps.join(" → "), rwa: amount * rw, asked: Math.max(0, Number(app.coverageYi) || 0)
      };
    }

    function calcOneLeg(leg) {
      const ccfRule = CCF_RULES.find(function (r) { return r.id === leg.ccfRuleId; }) || CCF_RULES[1];
      const ccf = typeof leg.ccfRate === "number" ? leg.ccfRate : ccfRateOf(ccfRule);
      leg.ccf = ccf;
      const fromPaper = !!(leg && leg.fromPaper);
      let ead = Math.max(0, (leg.balanceYi || 0) - (leg.impairmentYi || 0));
      let eadNote = fromPaper ? "明细账面余额，澳门元折成亿元" : "账面 − 减值";
      if (!fromPaper && leg.offbalance) {
        ead = Math.max(0, (leg.nominalYi || 0) * ccf);
        eadNote = "名义 × " + ccfRule.id + " 的 " + pct(ccf);
      }
      const cls = effectiveClassify(leg);
      const treeRw = cls && typeof cls.rwRate === "number" ? cls.rwRate : null;
      const originalRw = weightRateById(leg.originalRwRuleId);
      const handRw = typeof leg.handRw === "number" ? leg.handRw : null;
      const paperOpen = fromPaper && typeof leg.rwRate !== "number";
      const uncoveredRw = paperOpen
        ? 0
        : (fromPaper
          ? leg.rwRate
          : (handRw != null ? handRw : (treeRw == null ? (originalRw == null ? 1 : originalRw) : treeRw)));
      const uncoveredRule = fromPaper ? "底稿" : (treeRw == null ? (leg.originalRwRuleId || "CN_CORP_001") : (cls.ruleId || ""));
      const uncoveredNote = fromPaper
        ? ("底稿 " + ((cls.path || []).join(" · ")) + " · " + (cls.rwHint || pct(uncoveredRw)))
        : (treeRw == null
        ? ("决策树未给出固定权重，未覆盖部分沿用权重表 " + (leg.originalRwRuleId || "") + " " + pct(uncoveredRw))
        : ("决策树 " + ((cls.path || []).join(" → ")) + " · " + pct(uncoveredRw)));
      let remain = ead;
      const segs = [];
      let over = false;
      (leg.crmApps || []).forEach(function (app, k) {
        const asked = Math.max(0, Number(app.coverageYi) || 0);
        const seg = applyCrmApp(app, remain);
        seg.appIndex = k;
        if (asked > remain + 1e-9) over = true;
        remain = Math.max(0, remain - seg.amount);
        if (asked > 0 || seg.amount > 0) segs.push(seg);
      });
      segs.push({
        name: "未缓释",
        amount: remain,
        rw: uncoveredRw,
        rule: uncoveredRule,
        note: uncoveredNote + "，缓释不改这一档",
        rwa: remain * uncoveredRw,
        asked: remain
      });
      const rwa = segs.reduce(function (a, s) { return a + s.rwa; }, 0);
      const formula = paperOpen
        ? "权重还没填，这一档先不计入"
        : segs.filter(function (s) { return s.amount > 0; })
          .map(function (s) {
            const shown = fromPaper && cls && cls.rwHint ? cls.rwHint : pct(s.rw);
            return s.amount.toFixed(s.amount % 1 ? 2 : 0) + "×" + shown;
          })
          .join(" + ") + " = " + rwa.toFixed(2) + " 亿元";
      return {
        ead: ead, eadNote: eadNote, segs: segs, rwa: rwa, formula: formula,
        over: over, offbalance: !!leg.offbalance, classify: cls, ccf: ccf, ccfRuleId: ccfRule.id,
        openWeight: paperOpen || (!fromPaper && treeRw == null && handRw == null)
      };
    }

    function calcEngine() {
      const legs = state.calcLegs || [];
      const results = legs.map(function (leg) { return Object.assign({ leg: leg }, calcOneLeg(leg)); });
      const ead = results.reduce(function (a, r) { return a + r.ead; }, 0);
      const rwa = results.reduce(function (a, r) { return a + r.rwa; }, 0);
      const map = {};
      const order = [];
      results.forEach(function (r) {
        r.segs.forEach(function (s) {
          if (!(s.amount > 0)) return;
          const key = s.rule + "|" + s.name;
          if (!map[key]) {
            map[key] = { name: s.name, amount: 0, rwa: 0, rule: s.rule, note: s.note };
            order.push(key);
          }
          map[key].amount += s.amount;
          map[key].rwa += s.rwa;
        });
      });
      const segs = order.map(function (key) {
        const s = map[key];
        s.rw = s.amount > 0 ? s.rwa / s.amount : 0;
        return s;
      });
      const formula = results.length
        ? results.map(function (r, i) { return (r.leg.name || ("暴露" + (i + 1))) + " " + r.rwa.toFixed(r.rwa % 1 ? 2 : 0); })
          .join(" + ") + " = " + rwa.toFixed(rwa % 1 ? 2 : 0) + " 亿元"
        : "0";
      const fullUncovered = results.reduce(function (a, r) {
        if (r.leg && r.leg.fromPaper) return a + r.rwa;
        const rate = weightRateById(r.leg.originalRwRuleId);
        return a + r.ead * (rate == null ? 1 : rate);
      }, 0);
      return {
        ead: ead, segs: segs, rwa: rwa, formula: formula,
        over: results.some(function (r) { return r.over; }),
        legs: results,
        fullUncovered: fullUncovered,
        onCount: results.filter(function (r) { return !r.offbalance; }).length,
        offCount: results.filter(function (r) { return r.offbalance; }).length
      };
    }

    function fieldIds(prod) {

    function addFieldsToProduct(productKey, items, source) {
      const prod = PRODUCTS[productKey];
      if (!prod) return 0;
      const exist = {};
      prod.fields.forEach((f) => { exist[f.id] = true; });
      let n = 0;
      items.forEach((item) => {
        if (!item || !item.id || exist[item.id]) return;
        prod.fields.push({
          id: item.id,
          type: item.type || "字符串",
          sample: item.sample == null ? "" : String(item.sample),
          required: !!item.required,
          source: source || "custom",
          zh: item.zh || FIELD_LABEL[item.id] || item.id
        });
        if (!FIELD_LABEL[item.id] && item.zh) FIELD_LABEL[item.id] = item.zh;
        exist[item.id] = true;
        n += 1;
      });
      return n;
    }

    function parseFieldPaste(text) {
      const rows = [];
      String(text || "").split(/\n+/).forEach((line) => {
        line = line.trim();
        if (!line || line.indexOf("字段") === 0 || line.indexOf("id") === 0) return;
        const parts = line.split(/[\t,，|]/).map((x) => x.trim()).filter(Boolean);
        if (parts.length < 1) return;
        const id = parts[0].replace(/^standard\./, "");
        if (!/^[a-zA-Z_][\w]*$/.test(id)) return;
        rows.push({
          id: id,
          type: parts[1] || "字符串",
          sample: parts[2] || "",
          required: /必填|true|1|yes/i.test(parts[3] || ""),
          zh: parts[4] || FIELD_LABEL[id] || id
        });
      });
      return rows;
    }

    function applyUploadSuggestions() {
      const book = currentUpload();
      const next = {};
      const reasons = {};
      const used = {};
      UPLOAD_FIELD_HINTS.forEach(function (pair) {
        const col = (book.columns || []).find(function (item) {
          return !used[item.letter] && pair[1].test(String(item.header || "").replace(/\s/g, ""));
        });
        if (!col) return;
        used[col.letter] = true;
        next[pair[0]] = col.letter;
        reasons[pair[0]] = "表头「" + col.header + "」";
      });
      state.mapSuggested = next;
      state.mapAssignments = Object.assign({}, next);
      state.mapReasons = reasons;
      state.mapTouched = {};
      state.classifyTags = {};
      state.mapPhase = "ready";
    }

    function usingClassFields() {
      return !!(state.uploadBook && state.classFields && state.classFields.length);
    }

    function mapTableFields() {
      if (state.uploadBook && state.uploadBook.basis === "catalog") {
        const byId = {};
        (state.classFields || []).forEach(function (field) { byId[field.id] = field; });
        return (state.uploadBook.fieldIds || []).map(function (id) {
          return byId[id] || { id: id, label: id, source: "column" };
        });
      }
      if (!usingClassFields()) {
        const prod = PRODUCTS[state.product] || PRODUCTS.loan;
        return prod.fields || [];
      }
      return state.classFields.slice().sort(function (a, b) {
        const rank = function (field) {
          return field.source === "manual" || field.source === "calc" ? 1 : 0;
        };
        return rank(a) - rank(b);
      });
    }

    function mappingFields() {
      return classifyJudgeFields().map(function (field) {
        const src = (state.classFields || []).filter(function (item) { return item.id === field.id; })[0];
        const options = ((src && src.options) || []).slice(0, 30).map(function (opt) {
          return (opt.label || opt.code) + "=" + opt.code;
        });
        return {
          id: field.id,
          label: field.field,
          required: true,
          hint: (src && src.meaning) || field.role || "",
          sample: field.sample || "",
          options: options
        };
      });
    }

    function unmappedJudgeCount() {
      seedClassifyFields();
      return classifyJudgeFields().filter(function (field) {
        return state.classifyFieldPick[field.key] !== false && !field.assign;
      }).length;
    }

    function applyModelMapping(data) {
      const mapping = (data && data.mapping) || {};
      const reasons = (data && data.reasons) || {};
      const allowed = {};
      (currentUpload().columns || []).forEach(function (col) { allowed[col.letter] = true; });
      const next = {};
      const why = {};
      const used = {};
      Object.keys(mapping).forEach(function (id) {
        const slot = mapping[id];
        let letter = "";
        let constant = "";
        let reason = "";
        if (slot && typeof slot === "object") {
          letter = String(slot.column || slot.letter || "").toUpperCase();
          constant = String(slot.const || slot.value || "").trim();
          reason = slot.reason || reasons[id] || "";
        } else {
          const token = String(slot || "").trim();
          if (/^[A-Za-z]+$/.test(token)) letter = token.toUpperCase();
          else constant = token;
          reason = reasons[id] || "";
        }
        if (letter && allowed[letter] && !used[letter]) {
          next[id] = letter;
          why[id] = reason || ("模型对应到 " + letter);
          used[letter] = true;
          return;
        }
        if (constant) {
          next[id] = "__const__:" + constant;
          why[id] = reason || "表里没有这一列，模型填了常量";
        }
      });
      state.mapAssignments = next;
      classifyJudgeFields().forEach(function (field) {
        if (next[field.id]) return;
        const sample = String(field.sample || "").trim() || "未提供";
        next[field.id] = "__const__:" + sample;
        why[field.id] = why[field.id] || "表里没有对应列，先用字段示例";
      });
      state.mapSuggested = Object.assign({}, next);
      state.mapAssignments = next;
      state.mapReasons = why;
      state.mapTouched = {};
      state.classifyTags = {};
      state.mapExtract = (data && data.extract) || "";
      state.mapPhase = "ready";
      const missing = unmappedJudgeCount();
      state.mapError = missing ? ("还有 " + missing + " 个字段没有来源。") : "";
    }

    function requestModelMapping() {
      const book = state.uploadBook;
      if (!book) return;
      state.mapPhase = "loading";
      state.mapWait = "map";
      state.mapError = "";
      render();
      fetch("/api/sheet-map", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          file: book.file || state.mapFile,
          sheet: book.sheet,
          header_row: book.headerRow,
          row_count: book.rowCount || (book.rows || []).length,
          headers: (book.columns || []).map(function (col) {
            return {
              column: col.letter,
              header: col.header,
              samples: col.samples || (col.sample && col.sample !== "—" ? [col.sample] : [])
            };
          }),
          rows: (book.rows || []).slice(0, 40),
          fields: mappingFields()
        })
      })
        .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (pack) {
          if (state.page !== "engine" || !state.uploadBook) return;
          if (!pack.ok || !pack.data || !pack.data.mapping) {
            state.mapPhase = "ready";
            state.mapError = (pack.data && pack.data.error) || "模型没有返回字段对应。可以再发一次，或手动选列。";
            render();
            return;
          }
          applyModelMapping(pack.data);
          render();
        })
        .catch(function () {
          if (!state.uploadBook) return;
          state.mapPhase = "ready";
          state.mapError = "模型对应失败。已保留上次结果，可以再发一次，或手动选列。";
          render();
        });
    }

    function applyAiSuggestions() {
      const suggest = SAMPLE_UPLOAD.aiSuggest;
      const next = {};
      const reasons = {};
      Object.keys(suggest).forEach((id) => {
        const item = suggest[id];
        next[id] = item.letter || (item.const ? "__const__:" + item.const : "");
        reasons[id] = item.reason || "";
      });
      const prod = PRODUCTS[state.product] || PRODUCTS.loan;
      (prod.fields || []).forEach(function (field) {
        if (next[field.id]) return;
        const sample = String(field.sample || "").trim();
        if (!sample) return;
        next[field.id] = "__const__:" + sample;
        reasons[field.id] = reasons[field.id] || "样例没有这一列，用字段示例";
      });
      state.mapSuggested = Object.assign({}, next);
      state.mapAssignments = Object.assign({}, next);
      state.mapReasons = reasons;
      state.mapTouched = {};
      state.mapPhase = "ready";
    }

    function colByLetter(letter) {
      return (currentUpload().columns || []).find((c) => c.letter === letter) || null;
    }

    function weightPoints(rate) {
      const n = Number(rate) * 100;
      if (!isFinite(n)) return "";
      if (Math.abs(n - Math.round(n)) < 1e-6) return String(Math.round(n));
      return String(Math.round(n * 100) / 100);
    }

    function applyHandWeight(leg, raw) {
      const text = String(raw == null ? "" : raw).trim().replace(/%/g, "");
      const points = parseFloat(text);
      if (!leg.paperClass) leg.paperClass = {};
      if (!isFinite(points)) {
        if (leg.fromPaper) {
          leg.rwRate = null;
          leg.paperClass.rwRate = null;
          leg.paperClass.rwHint = "未定权重";
          const bits = String(leg.name || "").split(" · ");
          if (bits.length >= 2) {
            bits[bits.length - 1] = "未定权重";
            leg.name = bits.join(" · ");
          }
        } else {
          delete leg.handRw;
        }
        return;
      }
      const rate = points / 100;
      if (leg.fromPaper) {
        leg.rwRate = rate;
        leg.paperClass.rwRate = rate;
        leg.paperClass.rwHint = weightPoints(rate) + "%（手填）";
        const bits = String(leg.name || "").split(" · ");
        if (bits.length >= 2) {
          bits[bits.length - 1] = leg.paperClass.rwHint;
          leg.name = bits.join(" · ");
        }
      } else {
        leg.handRw = rate;
      }
    }

    function paperResultRows() {
      const rows = [];
      (state.calcLegs || []).forEach(function (leg, index) {
        if (!leg.fromPaper) return;
        const priced = calcOneLeg(leg);
        const cls = leg.paperClass || {};
        const open = !!leg.weightOpen;
        const filled = typeof leg.rwRate === "number";
        rows.push({
          index: index,
          name: leg.name || "",
          hint: cls.rwHint || "未定权重",
          path: (cls.path || []).join(" → "),
          ead: priced.ead,
          rwa: priced.rwa,
          open: open,
          filled: filled,
          points: filled ? weightPoints(leg.rwRate) : ""
        });
      });
      return rows;
    }

    function paperResultTable() {
      const rows = paperResultRows();
      const waiting = rows.filter(function (row) { return row.open && !row.filled; }).length;
      return (waiting
        ? "<div class=\"banner warn\">还有 " + waiting + " 档没有权重。在权重列填百分比，例如 75 表示 75%，填上后才计入风险加权资产。</div>"
        : "")
        + "<div class=\"panel\"><div class=\"panel-head\"><h2>分类与计算结果</h2><span>" + rows.length + " 档</span></div>"
        + "<div class=\"table-wrap\" style=\"max-height:480px\"><table class=\"data\"><thead><tr>"
        + "<th>分类</th><th>权重</th><th>敞口</th><th>风险加权资产</th></tr></thead><tbody>"
        + rows.map(function (row) {
          const weightCell = row.open
            ? "<input class=\"num-in\" data-paper-rw=\"" + row.index + "\" type=\"number\" min=\"0\" max=\"1250\" step=\"0.01\" placeholder=\"手填%\" value=\"" + esc(row.points) + "\" style=\"width:88px\" />"
            : esc(row.hint);
          const rwaCell = row.open && !row.filled ? "待手填" : yi(row.rwa);
          return "<tr><td>" + esc(row.name) + "</td><td>" + weightCell + "</td>"
            + "<td class=\"num\">" + yi(row.ead) + "</td><td class=\"num\"><strong>" + rwaCell + "</strong></td></tr>";
        }).join("")
        + "</tbody></table></div></div>";
    }

    function paperDownloadLink() {
      return "<button type=\"button\" class=\"btn btn-primary\" data-calc-download>下载计算结果</button>";
    }

    function downloadCalcWorkbook(calc) {
      const book = state.uploadBook || {};
      const paperRows = state.paperRows || [];
      const lines = paperRows.length
        ? paperRows.map(function (row) {
          const amount = Number(row.ead) || 0;
          return {
            sheet: row.sheet || "",
            excel_row: row.excel_row,
            header_row: row.header_row,
            exposure: row.exposure || "",
            weight: row.weight_text || "",
            ead: amount,
            rwa: typeof row.weight === "number" ? amount * row.weight : row.rwa,
            trace: row.trace || ""
          };
        })
        : (calc.legs || []).map(function (item) {
          const leg = item.leg || {};
          const cls = item.classify || {};
          if (!leg.sourceRow) return null;
          return {
            sheet: leg.sourceSheet || book.sheet || "",
            excel_row: leg.sourceRow,
            header_row: leg.sourceHeader || book.headerRow,
            exposure: (cls.category ? cls.category + " · " : "") + (cls.subclass || ""),
            weight: cls.rwHint || "",
            ead: (Number(item.ead) || 0) * 100000000,
            rwa: item.openWeight ? null : (Number(item.rwa) || 0) * 100000000,
            trace: (cls.path || []).join(" → ")
          };
        }).filter(Boolean);
      fetch("/api/calc-export", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          uploadId: book.uploadId || "",
          ead: calc.ead,
          rwa: calc.rwa,
          lines: lines
        })
      })
        .then(function (res) {
          if (!res.ok) throw new Error("download");
          return res.blob();
        })
        .then(function (blob) {
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = String((book.file || "信用风险RWA")).replace(/\.xlsx$/i, "") + "_计算RWA.xlsx";
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        })
        .catch(function () {
          state.mapError = "计算结果没有下载成功。";
          render();
        });
    }

    function matchFieldIds(match, bag) {
      if (!match || typeof match !== "object") return;
      if (match.field) bag[match.field] = true;
      ["all", "any"].forEach(function (key) {
        const list = match[key];
        if (Array.isArray(list)) list.forEach(function (item) { matchFieldIds(item, bag); });
      });
    }

    function modelFieldUsers() {
      const pairs = [];
      (state.calcLegs || []).forEach(function (leg) {
        const pc = leg.paperClass || {};
        if (leg.fromPaper && (pc.leaf || pc.subclass)) {
          pairs.push({ category: pc.subclass || "", leaf: pc.leaf || pc.subclass });
        }
      });
      Object.keys(state.classifyTags || {}).forEach(function (id) {
        if (state.classifyPick[id] === false) return;
        const parts = String(state.classifyTags[id] || "").split("||");
        if (parts[0] || parts[1]) pairs.push({ category: parts[0] || "", leaf: parts[1] || parts[0] });
      });
      const users = {};
      function walk(node, inherited, categoryLabel) {
        const bag = {};
        Object.keys(inherited).forEach(function (id) { bag[id] = true; });
        const local = {};
        matchFieldIds(node.match, local);
        if (node.skip && node.skip.field) local[node.skip.field] = true;
        Object.keys(local).forEach(function (id) { bag[id] = true; });
        const root = categoryLabel || node.label;
        const hit = pairs.some(function (pair) {
          return pair.leaf === node.label && (!pair.category || pair.category === root || pair.leaf === pair.category);
        });
        if (hit) {
          Object.keys(bag).forEach(function (id) {
            if (!users[id]) users[id] = {};
            users[id][root + " · " + node.label] = true;
          });
        }
        (node.children || []).forEach(function (child) { walk(child, bag, root); });
      }
      (BASE_EXP_TEMPLATE.categories || []).forEach(function (cat) { walk(cat, {}, cat.label); });
      return users;
    }

    function renderPaperCoverage() {
      const users = modelFieldUsers();
      const needed = Object.keys(users);
      const fields = needed.length
        ? (state.paperCoverage || []).filter(function (field) { return users[field.id]; })
        : (state.paperCoverage || []);
      const rows = fields.map(function (field) {
        const hits = field.hits || [];
        const models = users[field.id] ? Object.keys(users[field.id]) : [];
        return "<tr><td><strong>" + esc(field.label || field.id) + "</strong>"
          + "<div class=\"mono\" style=\"color:var(--muted)\">" + esc(field.id) + "</div></td>"
          + "<td>" + (models.length ? models.map(function (name) { return esc(name); }).join("<br>") : "—") + "</td>"
          + "<td>" + (hits.length
            ? hits.map(function (hit) { return esc(hit); }).join("<br>")
            : "<span class=\"opt\">底稿没有</span>")
          + "</td></tr>";
      }).join("");
      const mapped = fields.filter(function (field) { return (field.hits || []).length; }).length;
      return "<div class=\"banner ok\">判定字段已经对到源表列，对上 " + mapped + " / " + fields.length + " 个。开始计算后，每一行会加上风险暴露类型、权重和 RWA。"
        + "</div>"
        + "<div class=\"calc-nav\">"
        + "<span></span>"
        + "<span style=\"display:flex;gap:8px\">"
        + paperDownloadLink()
        + "<button type=\"button\" class=\"btn btn-primary\" data-calc-stage=\"1\">开始计算 →</button>"
        + "</span></div>"
        + "<div class=\"panel\"><div class=\"panel-head\"><h2>本批模型要用的字段</h2><span>Credit Risk Working 202609</span></div>"
        + "<div class=\"table-wrap\" style=\"max-height:520px\"><table class=\"data\"><thead><tr><th>分类字段</th><th>用于模型</th><th>底稿对应</th></tr></thead><tbody>"
        + (rows || "<tr><td colspan=\"3\" class=\"opt\">还没有分类结果，先做分类判断。</td></tr>")
        + "</tbody></table></div></div>";
    }

    function renderMappingBody() {
      if (state.uploadBook && state.uploadBook.basis === "paper" && state.paperCoverage && state.paperCoverage.length && state.mapPhase !== "loading") {
        return renderPaperCoverage();
      }
      const prod = PRODUCTS[state.product] || PRODUCTS.loan;
      const phase = state.mapPhase;
      const book = currentUpload();
      const cols = book.columns || [];
      const fieldUsers = modelFieldUsers();
      const neededIds = Object.keys(fieldUsers);
      const judgeMode = !!(state.uploadBook && state.uploadBook.basis !== "catalog" && state.uploadBook.basis !== "paper");
      let tableFields = judgeMode
        ? classifyJudgeFields().map(function (field) {
          return { id: field.id, label: field.field, required: true, source: "column" };
        })
        : mapTableFields();
      if (!judgeMode && neededIds.length) {
        const narrowed = tableFields.filter(function (field) { return fieldUsers[field.id]; });
        if (narrowed.length) tableFields = narrowed;
      }
      const mappedCount = tableFields.filter((f) => {
        const v = state.mapAssignments[f.id];
        return v && v !== "";
      }).length;
      const requiredMiss = tableFields.filter((f) => f.required && !state.mapAssignments[f.id]).length;

      if (phase === "idle") {
        return "<div class=\"banner\">还没有映射。先把判定字段对到源表列，计算时再写入每一行的风险暴露类型和 RWA。</div>"
          + (state.mapError ? "<div class=\"banner warn\">" + esc(state.mapError) + "</div>" : "")
          + "<div class=\"calc-nav\"><span></span>"
          + "<button type=\"button\" class=\"btn btn-primary\" data-calc-stage=\"0\">去映射 →</button></div>";
      }

      const aiBar = phase === "loading"
        ? "<div class=\"ai-bar wait\"><span class=\"spin\"></span>"
          + (state.mapWait === "map"
            ? "已把「" + esc(book.file || state.mapFile) + "」发给模型，请它按计算 RWA 提取要用的列…"
            : "正在读取「" + esc(state.mapFile || book.file) + "」…")
          + "</div>"
        : phase === "confirmed"
          ? "<div class=\"ai-bar\"><span class=\"tag ok\">已核对</span>"
            + "这套模型要用的字段已核对。可进入试算，或点「解锁修改」再改。</div>"
          : "<div class=\"ai-bar\"><span class=\"tag accent\">" + (state.uploadBook ? "模型已提取" : "大模型已预选") + "</span>"
            + (state.uploadBook && state.mapExtract ? esc(state.mapExtract) + " " : "")
            + "已自动填入 " + mappedCount + " / " + tableFields.length + " 个" + (judgeMode ? "判定字段" : (usingClassFields() ? "分类字段" : "标准字段")) + "。"
            + (judgeMode
              ? (requiredMiss ? " 还有 <strong>" + requiredMiss + "</strong> 个没有来源，每一项都要对上才能试算。" : " 每一项都已对应，可以进入试算。")
              : (usingClassFields()
              ? " 对不上的留空即可，确认后按已对上的列分类。"
              : (requiredMiss ? " 还有 <strong>" + requiredMiss + "</strong> 个必填未映射，请补选。" : " 必填已齐，核对后进入试算。")))
            + " 绿框为模型建议，蓝框为你改过的。</div>";

      const rows = tableFields.map((f) => {
        const id = f.id;
        const req = f.required;
        const val = state.mapAssignments[id] || "";
        const suggested = state.mapSuggested[id] || "";
        const touched = !!state.mapTouched[id];
        const isConst = val.indexOf("__const__:") === 0;
        const letter = isConst ? "" : val;
        const col = letter ? colByLetter(letter) : null;
        const reason = state.mapReasons[id] || "";
        const selClass = touched ? "user-pick" : (val && val === suggested ? "ai-pick" : "");
        let options = "<option value=\"\">不映射 / 稍后补</option>";
        if (isConst) {
          options += "<option value=\"" + esc(val) + "\" selected>常量 · " + esc(val.slice(10)) + "</option>";
        } else if (!state.uploadBook && SAMPLE_UPLOAD.aiSuggest[id] && SAMPLE_UPLOAD.aiSuggest[id].const) {
          const c = SAMPLE_UPLOAD.aiSuggest[id].const;
          options += "<option value=\"__const__:" + esc(c) + "\">常量 · " + esc(c) + "</option>";
        }
        options += cols.map((c) =>
          "<option value=\"" + esc(c.letter) + "\"" + (letter === c.letter ? " selected" : "") + ">"
          + esc(c.letter + " · " + c.header) + "</option>"
        ).join("");
        const sample = isConst
          ? ("常量：" + val.slice(10))
          : (col ? col.sample : "—");
        const sourceHint = phase === "loading" ? "…" : (
          isConst ? "<span class=\"tag muted\">常量</span>"
            : (col ? "<span class=\"src-pill\">" + esc(col.letter + " · " + col.header) + "</span>" : "<span class=\"opt\">未选</span>")
        );
        const title = f.label || FIELD_LABEL[id] || f.zh || id;
        const sourceTag = f.source === "manual"
          ? " <span class=\"opt\">按产品填</span>"
          : f.source === "calc"
            ? " <span class=\"opt\">计算得出</span>"
            : (req ? " <span class=\"req\">必填</span>" : " <span class=\"opt\">选填</span>");
        return "<tr>"
          + "<td><strong>" + esc(title) + "</strong>"
          + sourceTag
          + "<div class=\"mono\" style=\"color:var(--muted);margin-top:2px\">" + esc(judgeMode || !usingClassFields() ? ("standard." + id) : id) + "</div>"
          + (fieldUsers[id] ? "<div style=\"font-size:11px;color:var(--muted);margin-top:4px\">用于 " + esc(Object.keys(fieldUsers[id]).join("、")) + "</div>" : "")
          + (reason && phase !== "loading" ? "<div style=\"font-size:11px;color:var(--muted);margin-top:4px\">" + esc(reason) + "</div>" : "")
          + "</td>"
          + "<td>" + (phase === "loading"
            ? "<span class=\"opt\">识别中…</span>"
            : "<select class=\"" + selClass + "\" data-assign=\"" + esc(id) + "\">" + options + "</select>")
          + "</td>"
          + "<td>" + sourceHint + "</td>"
          + "<td class=\"sample\">" + esc(sample) + "</td>"
          + "</tr>";
      }).join("");

      return (state.mapError ? "<div class=\"banner warn\">" + esc(state.mapError) + "</div>" : "")
        + "<div class=\"upload-box has-file\" data-upload-pick>"
        + "<strong>" + esc(state.mapFile || book.file) + "</strong>"
        + "<span>工作表 " + esc(book.sheet) + " · 表头第 " + book.headerRow + " 行 · "
        + cols.length + " 列表头 · " + (book.rows || []).length + " 行"
        + (book.truncated ? "（文件更长，先载入前 300 行）" : "") + "</span>"
        + "<span style=\"margin-top:8px;color:var(--accent);font-weight:600\">点击再选一个文件</span></div>"
        + aiBar
        + "<div class=\"toolbar\" style=\"margin-bottom:12px\">"
        + "<div class=\"field\"><label>产品标准</label><select id=\"mapProdSel\">"
        + Object.keys(PRODUCTS).map((k) =>
          "<option value=\"" + k + "\"" + (state.product === k ? " selected" : "") + ">" + esc(PRODUCTS[k].label) + "</option>"
        ).join("")
        + "</select></div>"
        + "<div class=\"spacer\"></div>"
        + (phase !== "idle" ? "<button type=\"button\" class=\"btn\" data-map-reset>换一份文件</button>" : "")
        + "<button type=\"button\" class=\"btn\" data-ai-remap" + (phase === "loading" ? " disabled" : "") + ">重新识别</button>"
        + (phase === "confirmed"
          ? "<button type=\"button\" class=\"btn\" data-map-unlock>解锁修改</button>"
            + "<button type=\"button\" class=\"btn btn-primary\" data-calc-stage=\"1\">映射完成 · 开始计算 →</button>"
          : "<button type=\"button\" class=\"btn btn-primary\" data-map-confirm" + (requiredMiss || phase === "loading" ? " disabled" : "") + ">映射完成 · 开始计算</button>")
        + "</div>"
        + "<div class=\"panel\"><div class=\"panel-head\"><h2>" + (judgeMode ? "判定字段 ← 明细表头" : (neededIds.length && tableFields.length < mapTableFields().length ? "本模型要用的字段" : (usingClassFields() ? "分类 JSON 字段 ← 明细表头" : "标准字段 ← 明细表头"))) + "</h2>"
        + "<span>" + (usingClassFields() ? "只核对该模型要用的字段" : "一套标准 · 大模型先选 · 你可改") + "</span></div>"
        + "<div class=\"table-wrap\" style=\"max-height:420px\"><table class=\"data\"><thead><tr>"
        + "<th style=\"min-width:200px\">标准字段</th><th style=\"min-width:220px\">对应表头</th>"
        + "<th>来源</th><th>列中示例</th>"
        + "</tr></thead><tbody>" + rows + "</tbody></table></div></div>";
    }

    function todayIso() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return d.getFullYear() + "-" + m + "-" + day;
    }

    function currentCustomer() {
      return CUSTOMERS.find((t) => t.id === state.clientId) || CUSTOMERS[0];
    }

    function ensureVerKb(ver) {
      if (!ver.kbClient) ver.kbClient = {};
      if (!ver.kbGlobal) ver.kbGlobal = { synced: false, at: "" };
      return ver;
    }

    function verClientSynced(ver) {
      ensureVerKb(ver);
      const row = ver.kbClient[state.clientId];
      return !!(row && row.synced);
    }

    function verGlobalSynced(ver) {
      ensureVerKb(ver);
      return !!(ver.kbGlobal && ver.kbGlobal.synced);
    }

    function markVerDeposit(ver, scope) {
      ensureVerKb(ver);
      const at = ver.updatedAt || todayIso();
      if (scope === "global") {
        ver.kbGlobal = { synced: true, at: at };
      } else {
        ver.kbClient[state.clientId] = { synced: true, at: at };
      }
      if (!ver.kbSpace) ver.kbSpace = "信用风险 · " + ver.id;
    }

    /** 静默同步到知识库：本客户 + 全部检索，无需手动点按钮 */
    function silentSyncVersion(ver) {
      if (!ver) return;
      if (!ver.updatedAt) ver.updatedAt = todayIso();
      markVerDeposit(ver, "client");
      markVerDeposit(ver, "global");
    }

    function renderClientSel() {
      const el = document.getElementById("clientSel");
      if (!el) return;
      el.innerHTML = CLIENT_CATEGORIES.map((cat) => {
        const rows = CUSTOMERS.filter((c) => c.category === cat);
        if (!rows.length) return "";
        return "<optgroup label=\"" + esc(cat) + "\">"
          + rows.map((c) =>
            "<option value=\"" + esc(c.id) + "\"" + (state.clientId === c.id ? " selected" : "") + ">"
            + esc(c.name) + "（" + esc(c.code) + "）</option>"
          ).join("")
          + "</optgroup>";
      }).join("");
    }

    function modalShell(opts) {

      const sizeCls = o.xl ? " xl" : (o.wide ? " wide" : "");
      return "<div class=\"modal-backdrop\" data-modal-backdrop>"
        + "<div class=\"modal-dialog" + sizeCls + "\" role=\"dialog\" aria-modal=\"true\">"
        + "<div class=\"modal-head\"><div>"
        + "<h3>" + esc(o.title || "") + "</h3>"
        + (o.sub ? "<p>" + o.sub + "</p>" : "")
        + "</div><button type=\"button\" class=\"modal-close\" data-modal-dismiss aria-label=\"关闭\">×</button></div>"
        + "<div class=\"modal-body\">" + (o.body || "") + "</div>"
        + (o.foot ? "<div class=\"modal-foot\">" + o.foot + "</div>" : "")
        + "</div></div>";
    }

    function dismissModals() {

      const m = {
        kind: k,

    function saveExpFlowModalJson() {
      const m = state.expFlowModal;
      if (!m || m.kind === "overview") return false;
      const ta = document.getElementById("expFlowModalJson");
      if (!ta) return false;
      let parsed;
      try {
        parsed = JSON.parse(ta.value);
      } catch (err) {
        m.err = "未保存。JSON 无法解析：" + (err && err.message ? err.message : String(err));
        return false;
      }
      const flowErrors = [];
      validateFlowJson(parsed, flowErrors);
      if (flowErrors.length) {
        m.err = formatJsonErrors(flowErrors);
        return false;
      }
      if (!parsed || typeof parsed !== "object") {
        m.err = "流程 JSON 必须是对象。";
        return false;
      }
      if (m.kind === "base") {
        let next;
        if (isLogicFlowJson(parsed)) {
          next = logicJsonToFlow(parsed, BASE_EXP_TEMPLATE);
        } else if (Array.isArray(parsed.categories)) {
          next = parsed;
        } else {
          m.err = "请保留 layers（逻辑视图）或 categories。";
          return false;
        }
        Object.keys(BASE_EXP_TEMPLATE).forEach((k) => { delete BASE_EXP_TEMPLATE[k]; });
        Object.assign(BASE_EXP_TEMPLATE, next);
        BASE_EXP_TEMPLATE.ref = false;
        if (!BASE_EXP_TEMPLATE.head || !BASE_EXP_TEMPLATE.head.length) {
          BASE_EXP_TEMPLATE.head = [
            { id: "proc:start", type: "process", label: "开始判定", content: { note: "标准字段已就绪" } },
            { id: "proc:product", type: "process", label: "识别产品", content: { note: "按产品类型进入对应瀑布" } }
          ];
        }
        m.err = "";
        m.mode = "view";
        state.expMsg = "通用流程的字段与公式已更新。";
        return true;
      }
      const key = m.productKey || state.product;
      const prod = PRODUCTS[key];
      if (!prod) {
        m.err = "产品不存在。";
        return false;
      }
      if (parsed.ref === true || parsed.mode === "ref") {
        prod.expFlow = makeExpFlowRef();
        m.err = "";
        m.mode = "view";
        state.expMsg = "「" + prod.label + "」已设为引用通用流程。";
        return true;
      }
      let nextFlow;
      if (isLogicFlowJson(parsed)) {
        const fallback = isExpFlowRef(prod.expFlow) ? BASE_EXP_TEMPLATE : prod.expFlow;
        nextFlow = logicJsonToFlow(parsed, fallback);
      } else if (Array.isArray(parsed.categories)) {
        nextFlow = parsed;
      } else {
        m.err = "请保留 layers（逻辑视图）或 categories；或设 mode:\"ref\"。";
        return false;
      }
      nextFlow.id = nextFlow.id || ("exp_flow_" + key);
      nextFlow.name = nextFlow.name || (prod.label + " · 分类流程");
      nextFlow.based_on = nextFlow.based_on || BASE_EXP_TEMPLATE.id;
      nextFlow.ref = false;
      nextFlow.customized = true;
      if (!nextFlow.head) nextFlow.head = cloneExpFlow(BASE_EXP_TEMPLATE).head;
      prod.expFlow = nextFlow;
      m.err = "";
      m.mode = "view";
      state.expMsg = "「" + prod.label + "」字段与公式已保存。";
      return true;
    }

    function findExpNode(id) {
      if (String(id || "").indexOf("route:") === 0) {
        if (id === "route:base") {
          return { id: id, kind: "route", label: "通用流程模板", note: "各产品默认可引用 · 不在总览兜底", productKey: null };
        }
        if (id === "route:empty") {
          return { id: id, kind: "route", label: "暂无产品线路", note: "请先新建产品类型" };
        }
        const key = id.slice(6);
        const prod = PRODUCTS[key];
        const st = productExpStatus(key);
        return {
          id: id, kind: "route", label: prod ? prod.label : key,
          note: st.label, productKey: key,
          match: { all: [{ field: "product_type", op: "eq", value: prod ? prod.label : key }] }
        };
      }
      const overviewKey = overviewActiveProductKey();
      const cats = overviewKey
        ? categoriesFromFlow(flowForProductKey(overviewKey), overviewKey)
        : expCategories();
      if (state.expScope === "overview" && (id === "proc:start" || id === "proc:product")) {
        const __expHead = expHead();
        for (let i = 0; i < __expHead.length; i++) if (__expHead[i].id === id) return __expHead[i];
      }
      function findDrawn(nodes, parent) {
        for (let j = 0; j < (nodes || []).length; j++) {
          const node = nodes[j];
          if (node.id === id) {
            return Object.assign({
              kind: parent ? "subclass" : "category",
              parent: parent ? parent.id : undefined,
              parentLabel: parent ? parent.label : undefined,
              productKey: overviewKey || undefined
            }, node);
          }
          const hit = findDrawn(node.children, node);
          if (hit) return hit;
        }
        return null;
      }
      for (let i = 0; i < cats.length; i++) {
        const hit = findDrawn([cats[i]], null);
        if (hit) return hit;
      }
      if (id === "res:rw") {
        return {
          id: id, kind: "result", label: "风险权重",
          note: "暴露类别与原 RW", productKey: overviewKey || undefined
        };
      }
      if (id === "rule:hit") {
        return {
          id: id, kind: "rule", label: "RWA 计算",
          note: "表内、表外分别汇总", productKey: overviewKey || undefined
        };
      }
      const flowForChain = overviewKey
        ? flowForProductKey(overviewKey)
        : activeExpFlow();
      const bookHit = chainOf(flowForChain, "books").find((s) => s.id === id);
      if (bookHit) {
        return Object.assign({
          productKey: overviewKey || undefined,
          note: bookHit.note || ""
        }, bookHit);
      }
      const tailHit = chainOf(flowForChain, "tail").find((s) => s.id === id);
      if (tailHit) {
        return Object.assign({
          productKey: overviewKey || undefined,
          note: tailHit.note || ""
        }, tailHit);
      }
      return null;
    }

    /** 总览：整棵分类树一次铺开，不按「当前命中」收起其它分支 */
    function buildGlobalGraph() {
      const cats = expCategories();
      const nodes = [];
      const edges = [];
      const COL = 300;
      const ROW = 96;
      const SIB_GAP = 10;
      const NODE_W = 232;
      const NODE_H = 74;

      function blockOf(node) {
        const kids = node.children || [];
        if (!kids.length) return ROW;
        let sum = 0;
        kids.forEach(function (kid, i) {
          sum += blockOf(kid);
          if (i < kids.length - 1) sum += SIB_GAP;
        });
        return Math.max(sum, ROW);
      }

      function place(list, depth, parentId, yTop) {
        let y = yTop;
        list.forEach(function (item, idx) {
          const kids = item.children || [];
          const block = blockOf(item);
          const leaf = !kids.length;
          const weight = leaf && item.rw && item.rw !== "—" ? item.rw : "";
          const note = leaf
            ? ((item.otherwise ? "本层都不成立" : "") + (weight ? ((item.otherwise ? " · " : "") + weight) : ""))
            : ((item.otherwise ? "本层都不成立 · " : "") + kids.length + " 个下级");
          nodes.push({
            id: item.id,
            kind: depth === 0 ? "category" : "subclass",
            badge: depth === 0 ? "分类" : (leaf ? "权重" : "细分"),
            label: depth === 0 ? ((idx + 1) + ". " + item.label) : item.label,
            note: note,
            x: 36 + depth * COL,
            y: y + (block - NODE_H) / 2,
            w: NODE_W,
            h: NODE_H,
            parent: parentId || undefined,
            compact: true,
            globalNode: true
          });
          if (parentId) {
            edges.push({
              from: parentId,
              to: item.id,
              label: item.otherwise ? "都不成立" : (idx === 0 ? "是" : ""),
              flow: true,
              yesPath: !item.otherwise,
              noPath: !!item.otherwise
            });
          }
          if (kids.length) place(kids, depth + 1, item.id, y);
          y += block;
          if (idx < list.length - 1) y += SIB_GAP;
        });
      }

      place(cats, 0, null, 20);
      for (let i = 1; i < cats.length; i++) {
        edges.push({
          from: cats[i - 1].id,
          to: cats[i].id,
          label: "否，继续",
          flow: true,
          noPath: true
        });
      }
      return { nodes: nodes, edges: edges, focusIdx: 0, global: true };
    }

        anchorY: anchorY,

        nodeW: NODE_W,
        flow: activeExpFlow()

      return { nodes: nodes, edges: edges, focusIdx: focusIdx };
    }
