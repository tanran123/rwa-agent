[program:rwa-api]
command=node /app/server/src/index.js
directory=/app/server
autorestart=true
startretries=100
startsecs=2
stopasgroup=true
killasgroup=true
environment=PORT="8780",NODE_ENV="production"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rwa-agent]
command=/opt/venv/bin/python -u /app/app.py
directory=/app
autorestart=true
startretries=100
startsecs=2
stopasgroup=true
killasgroup=true
environment=RWA_PORT="8766",PYTHONUNBUFFERED="1",RWA_ENV_FILE="/app/.env"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
