services:
  rwa-agent:
    image: rwa-agent:${RWA_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rwa-agent
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - path: ./app.env
        required: true
      - path: ./mysql.env
        required: false
      - path: ./model.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${RWA_HTTP_PORT:-8080}:80"
    volumes:
      - ./output:/app/output
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
